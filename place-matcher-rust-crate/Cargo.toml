[package]
name = "place-matcher"
version = "0.5.0"
edition = "2024"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Deterministic and probabilistic matching of geographic places (Haversine distance, external place IDs, ISO 3166-1 alpha-2 country codes, categories) with explainable per-field score breakdowns."
license = "MIT OR Apache-2.0 OR GPL-2.0 OR GPL-3.0 OR BSD-3-Clause"
repository = "https://github.com/sixarm/place-matcher-rust-crate"
readme = "README.md"
keywords = ["place", "matching", "geographic", "geocoding", "deduplication"]
categories = ["science", "data-structures"]
include = ["src/**/*", "LICENSE.md", "README.md", "CHANGELOG.md"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
strsim = "0.11"
thiserror = "2.0"
soundex = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

[[bench]]
name = "match_pair"
harness = false
