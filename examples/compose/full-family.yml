  # ---- authentication (central SSO provider) ---------------------------
  authentication-migrate:
    build: { context: ../.., dockerfile: authentication/authentication-service-with-loco/Dockerfile }
    image: mxi-family-authentication-service
    entrypoint: ["/app/authentication-service-cli"]
    command: ["db", "migrate", "-e", "production"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://loco:loco@postgres:5432/authentication
      # SEC-A1 fail-closed: LOCO_ENV=production (baked into the image)
      # refuses the crate's dev-seed fallback, so a real seed is
      # required even for this one-shot migrate step. Dev-only
      # placeholder — regenerate for anything beyond a local demo:
      #   python3 -c "import secrets, base64; \
      #     print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode().rstrip('='))"
      TOKEN_PRIVATE_KEY_SEED: ${TOKEN_PRIVATE_KEY_SEED:-dv-Nv3h-Q3THpU3sgs5VvzwuWe4MbHy7uEjNjNLGEws}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mxi-family]

  authentication-service:
    build: { context: ../.., dockerfile: authentication/authentication-service-with-loco/Dockerfile }
    image: mxi-family-authentication-service
    # COMPOSE-WORKER — see person-service's comment above (this crate's
    # binary is authentication-service-cli, matching its Dockerfile CMD).
    command: ["/app/authentication-service-cli", "start", "--server-and-worker"]
    restart: unless-stopped
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://loco:loco@postgres:5432/authentication
      TOKEN_PRIVATE_KEY_SEED: ${TOKEN_PRIVATE_KEY_SEED:-dv-Nv3h-Q3THpU3sgs5VvzwuWe4MbHy7uEjNjNLGEws}
    ports: ["8091:5150"]
    depends_on:
      authentication-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:5150/_health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [mxi-family]

  # ---- link-graph (read-model aggregator) ------------------------------
  # No separate migrate step: this crate's own production.yaml sets
  # `auto_migrate: true` (unlike every other crate here), so `start`
  # applies pending migrations itself.
  link-graph-service:
    build: { context: ../.., dockerfile: link/link-graph-service-with-loco/Dockerfile }
    image: mxi-family-link-graph-service
    # COMPOSE-WORKER — see person-service's comment above. This crate
    # registers no workers today (connect_workers is a no-op), so this
    # is a no-op in practice, kept for uniformity across the family.
    command: ["/app/link-graph-service", "start", "--server-and-worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://loco:loco@postgres:5432/link_graph
      RUST_LOG: ${RUST_LOG:-info}
    ports: ["8092:5160"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:5160/_health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [mxi-family]

networks:
  mxi-family:
    driver: bridge

volumes:
  postgres_data:
    driver: local
