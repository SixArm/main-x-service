# The full Main X Index family: ten entity registries + the central
# authentication-service + the link-graph read-model aggregator, all
# eleven services against ONE shared Postgres server (twelve logical
# databases — one per service, `init/10-databases.sh` creates them).
#
# This is the demo/dev topology, not a production one: a single
# Postgres container is simplest to bring up and tear down for a
# tutorial or the bus-gated test tier (see agents/share/architecture.md
# — each service still owns its own database/schema and none shares
# tables; only the physical server is shared here). A real deployment
# would more likely give each service its own Postgres instance, the
# way every crate's own `compose.test.yaml` already does.
#
# `<ENTITY>_REQUIRE_AUTH` is left at its default (off) everywhere in
# this file — see enforced.yml for the ABAC-guarded variant, applied
# as a compose override on top of this file.
#
# Build context is the REPOSITORY ROOT for every service, resolved
# relative to THIS file's location (`../..`), not your cwd — every
# crate's Dockerfile COPYs in sibling path dependencies that live
# outside its own directory (agents/share/architecture.md: no crate
# has a root Cargo.toml).
#
# Usage (from anywhere; building all twelve images takes a while —
# they compile in release mode):
#   podman compose -f examples/compose/full-family.yml build
#   podman compose -f examples/compose/full-family.yml up -d
#   curl http://localhost:8089/_health   # case-service, for example
#   podman compose -f examples/compose/full-family.yml down -v
#
# NOTE: run `build` and `up` as two separate steps, not `up -d --build`
# — see single-service.yml's header comment for why (a compose-provider
# hang observed on this repository's large build context).
#
# Host ports (all map to the container's internal port — 8080 for the
# six person-style crates, 5150 for the five loco-idiomatic registries
# and authentication, 5160 for link-graph):
#
#   8081 person        8085 event          8089 case
#   8082 worker         8086 course         8090 portfolio
#   8083 place          8087 organization   8091 authentication
#   8084 thing           8088 care-pathway   8092 link-graph

x-common-env: &common-env
  RUST_LOG: ${RUST_LOG:-info}
  # Required by loco's config schema (auth.jwt.secret has no default,
  # except link-graph which has no auth.jwt block at all); unused by
  # any of these crates' actual auth flow, which is offline PASETO
  # verification (see agents/share/jwt.md), not JWT sessions.
  JWT_SECRET: ${JWT_SECRET:-dev-only-unused-jwt-secret}

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: mxi-family-postgres
    environment:
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
      POSTGRES_DB: postgres
    volumes:
      # PGDATA lives under /var/lib/postgresql in the postgres:18 image
      # (.../18/docker, not the .../data of earlier majors) — the old
      # path makes the 18 image refuse to start (agents/share/postgresql.md).
      - postgres_data:/var/lib/postgresql
      - ./init/00-extensions.sh:/docker-entrypoint-initdb.d/00-extensions.sh:ro
      - ./init/10-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loco"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - mxi-family

  # ---- person -------------------------------------------------------
  person-migrate:
    build: { context: ../.., dockerfile: person/person-service-with-loco/Dockerfile }
    image: mxi-family-person-service
    entrypoint: ["/app/person-service"]
    command: ["db", "migrate", "-e", "production"]
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://loco:loco@postgres:5432/person
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mxi-family]

  person-service:
    build: { context: ../.., dockerfile: person/person-service-with-loco/Dockerfile }
    image: mxi-family-person-service
    # COMPOSE-WORKER: the Dockerfile's own CMD is server-only ("start"),
    # which never registers BulkJobWorker (loco's connect_workers only
    # runs under `start --server-and-worker`) — so a bulk import/export
    # job would accept a 202 and then sit in "queued" forever. No
    # ENTRYPOINT is set in the image, so the full argv is repeated here
    # (a bare `command: ["start", "--server-and-worker"]` would try to
    # exec "start" as a binary path and fail).
    command: ["/app/person-service", "start", "--server-and-worker"]
    restart: unless-stopped
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://loco:loco@postgres:5432/person
    ports: ["8081:8080"]
    depends_on:
      person-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [mxi-family]

  # ---- worker -------------------------------------------------------
  worker-migrate:
    build: { context: ../.., dockerfile: worker/worker-service-with-loco/Dockerfile }
