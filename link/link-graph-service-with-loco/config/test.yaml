# Loco configuration file — link-graph-service (test).

# Application logging configuration
logger:
  enable: false
  pretty_backtrace: true
  level: debug
  format: compact

# Web server configuration
server:
  port: 5160
  host: http://localhost
  middlewares:
    # See development.yaml (SEC-M1 explicit backstop).
    limit_payload:
      enable: true
      body_limit: 2mb

# Worker Configuration
workers:
  mode: ForegroundBlocking

# Queue Configuration
queue:
  kind: Postgres
  uri: {{ get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/link_graph_service_test") }}
  dangerously_flush: false

# Database Configuration
database:
  uri: {{ get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/link_graph_service_test") }}
  enable_logging: false
  connect_timeout: {{ get_env(name="DB_CONNECT_TIMEOUT", default="500") }}
  idle_timeout: {{ get_env(name="DB_IDLE_TIMEOUT", default="500") }}
  min_connections: {{ get_env(name="DB_MIN_CONNECTIONS", default="1") }}
  max_connections: {{ get_env(name="DB_MAX_CONNECTIONS", default="1") }}
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: true

# Cache provider: in-memory (loco `cache_inmem`, enabled by default).
cache:
  kind: InMem
  max_capacity: 33554432 # 32MiB (default if not specified)
