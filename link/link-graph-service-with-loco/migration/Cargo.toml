[package]
name = "migration"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"

[dependencies.sea-orm-migration]
version = "2.0"
features = [
  # Enable at least one ASYNC_RUNTIME and one DATABASE_DRIVER feature.
  "runtime-tokio-rustls",
  "sqlx-postgres",
]
