[workspace]

[package]
name = "link-graph-service"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false
default-run = "link-graph-service"
description = "Link graph service — read-model aggregator for cross-service entity linking, serving the queryable graph over neighbors/single-view/freshness"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Keyed integrity MACs with production-grade key handling — one audited
# implementation shared by every service, rather than a copy per crate.
integrity-mac = { path = "../../integrity/integrity-mac-rust-crate" }
# Unkeyed content digests over the audit pre-image, written even when
# no MAC key is configured — a sponge and a Merkle-Damgard chain, so
# an advance against one design family does not transfer.
sha2 = { version = "0.11" }
sha3 = { version = "0.12" }
axa = { version = "0.7", features = ["sqlx", "openapi", "opentelemetry", "ratelimit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database: sqlx directly, no ORM. Every statement is a `query!` /
# `query_as!` / `query_scalar!` literal in `src/models/`, checked at
# compile time against the committed `.sqlx/` data (spec/tech-stack §5).
# The same driver axa's `sqlx` feature already pulls in, so this adds no
# new database stack. Timestamps map to `chrono`: with sqlx's `time`
# feature on as well, sqlx 0.9.0's macros warn on every timestamp column.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "uuid", "chrono", "json"] }
# `serde` for the timestamps and dates the graph and audit endpoints
# serialize; `SeaORM` used to turn it on.
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
mimalloc = { version = "0.1.52" }
prometheus = { version = "0.14" }

# The one shared cross-service-linking contract: EntityType / EntityRef
# (URN parse/Display/serde as a single TEXT column) + the closed v1
# EdgeKind registry. Depended-on rather than re-copied (see spec §5.1 /
# §13 T-2/T-3 deviation note).
entity-ref = { path = "../entity-ref-rust-crate" }

# LNK-4 / T-29 (spec §16 OQ-9, cross-service-linking.md §5.2): the
# `same_identity` suggestion comparator (`src/suggest.rs`) reuses
# person-matcher's pure `Scorer::jaro_winkler_similarity` and `Gender`
# rather than reimplementing string similarity. `person-matcher` is
# depended on (not `worker-matcher`) because the two crates' `Scorer` /
# `Gender` are near-duplicates (see `worker-matcher`'s own copy) and
# person-matcher is the family's reference matcher crate — one dependency
# covers both sides of the person/worker comparison, since `IdentityProbe`
# is the same lean type regardless of which service a record came from.
person-matcher = { version = "0.6.1", path = "../../person/person-matcher-rust-crate" }

# Offline PASETO v4.public verification + the shared ABAC engine, for
# case<->person governance (spec T-16/T-19; design §10). Env-supplied key
# set only (no `fetch` feature — boot-time URL fetch is a follow-up).
# `fetch` adds `Verifier::from_paseto_keys_url` for the boot-time key-set
# fetch and the rotation refresh loop (see src/auth.rs).
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", default-features = false }

# Lazy verify-on-read (spec T-10 / design §5.1): a one-shot GET to a
# record's source service to resolve unknown presence. Only the status
# code is used. Behaviour is gated by the LINK_GRAPH_LAZY_VERIFY flag.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
  "query",
] }

# Real-broker bus consumer (BUS-2; agents/share/event-bus.md §5/§8/§9).
# Optional and behind the `fluvio` feature below, so a default build's
# dependency tree and boot behaviour are unchanged — lazy verify-on-read
# and reconciliation remain the integrity path with no broker configured.
fluvio = { version = "0.50", optional = true }
# `StreamExt::next()` over a Fluvio `ConsumerStream`.
futures-util = { version = "0.3", optional = true, default-features = false, features = [
  "std",
] }

[features]
# PASETO bearer verification (the family default): `Verifier`, the boot key
# fetch and the rotation refresh. Turn it off (`--no-default-features`) for a
# deployment whose only bearer credential is a Keycloak access token.
default = ["paseto"]
paseto = ["authentication-verifier/paseto", "authentication-verifier/fetch"]
# Also accept Keycloak (OIDC) access tokens, configured by
# `LINK_GRAPH_KEYCLOAK_*` (see src/auth.rs). Off by default.
keycloak = ["authentication-verifier/keycloak"]
# Off by default. The read-only-to-world posture and the `apply_event`/
# `apply_event_idempotent` seam need no feature; only the real Fluvio
# producer connection lives behind this.
fluvio = ["dep:fluvio", "dep:futures-util"]

[[bin]]
name = "link-graph-service"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
# A local OIDC provider so tests/keycloak_guard.rs can push a Keycloak access
# token through the real guard without a Keycloak container. Tests only.
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", default-features = false, features = ["test-idp"] }
axa = { version = "0.7", features = ["sqlx", "testing", "openapi", "opentelemetry", "ratelimit"] }
serial_test = { version = "4.0.1" }
tokio = { version = "1.54", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "net",
] }
# An in-process OTLP/gRPC collector for `tests/otlp_export.rs`: the
# generated `TraceServiceServer` / `MetricsServiceServer` plus tonic's
# server transport, so the service's OTLP wiring is proved against a real
# gRPC listener in a normal `cargo test` run — no external collector,
# nothing `#[ignore]`d. `tests/otlp_export.rs` also makes a real HTTP
# request against the served router with the main `reqwest` dependency.
opentelemetry-proto = { version = "0.33", default-features = false, features = [
  "gen-tonic",
  "trace",
  "metrics",
] }
tonic = { version = "0.14" }
tokio-stream = { version = "0.1", features = ["net"] }
# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process, so
# the case↔person concealment can be proved end-to-end with real bearer
# tokens (tests/concealment.rs) without the auth service.
ed25519-dalek = { version = "3.0" }
rusty_paseto = { version = "0.10", default-features = false, features = [
  "v4_public",
  "serde_json",
] }
sha2 = { version = "0.11" }
base64 = { version = "0.23" }

# Proc macros and build scripts are not stripped. When stripping reaches
# them, macOS refuses to load the stripped `sqlx-macros` dylib
# ("mis-aligned LINKEDIT string pool") and a release build fails. Only
# host-side build tools are affected; the shipped binary is unchanged.
[profile.release.build-override]
strip = false
