[package]
name = "entity-ref-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }

[dependencies.entity-ref]
path = ".."

# cargo-fuzz scaffolding for the cross-service-linking value types
# (SEC-I2). `EntityRef` is parsed from a single `TEXT` column and from
# request bodies naming a record in another service, so `FromStr` and the
# serde path run on attacker-supplied strings. Not a member of any parent
# workspace, so it never affects the crate's normal build/test/clippy, and
# it carries no `rust-version`: cargo-fuzz is nightly-only
# (spec/rust-msrv-n-minus-3.md §2).

[[bin]]
name = "parse_ref"
path = "fuzz_targets/parse_ref.rs"
test = false
doc = false
bench = false

[[bin]]
name = "deserialize_ref"
path = "fuzz_targets/deserialize_ref.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry_tokens"
path = "fuzz_targets/registry_tokens.rs"
test = false
doc = false
bench = false
