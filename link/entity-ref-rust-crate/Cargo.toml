[package]
name = "entity-ref"
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "EntityRef — the shared cross-service-linking value type (entity_type:uuid URN) + edge-kind registry for the Main X Index family"
readme = "README.md"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/main-x-service/tree/main/link/entity-ref-rust-crate"
keywords = ["identity", "graph", "linking", "urn"]
categories = ["data-structures"]

[lib]
name = "entity_ref"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
uuid = { version = "1.29", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }

[[bench]]
name = "entity_ref"
harness = false

# Faster dev builds: line tables are enough for backtraces and panics, and
# dependencies carry no debug info at all.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
# Without this, cargo strips debug info from proc-macro dylibs (sqlx-macros),
# and macOS then refuses to load them.
strip = "none"

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
