logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5150
  binding: 0.0.0.0
  host: http://localhost
  middlewares:
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
    fallback:
      enable: true
      file: "assets/static/404.html"

workers:
  mode: BackgroundQueue

mailer:
  smtp:
    enable: false

database:
  uri: "{{ get_env(name=\"DATABASE_URL\", default=\"postgres://localhost/place_service_development\") }}"
  enable_logging: true
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 10
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

queue:
  kind: Postgres
  uri: "{{ get_env(name=\"DATABASE_URL\", default=\"postgres://localhost/place_service_development\") }}"
  dangerously_flush: false

auth:
  jwt:
    secret: "PLEASE_CHANGE_ME_DEVELOPMENT_ONLY"
    expiration: 604800
