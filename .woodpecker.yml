# Codeberg CI (Woodpecker).
#
# `origin` pushes to both Codeberg and GitHub, so both remotes need their
# own pipeline or one of them shows no checks at all. Every step shells out
# to `scripts/ci-check.sh`, the same entry point `.github/workflows/ci.yml`
# uses, so the two platforms run byte-identical commands.
#
# **Difference from the GitHub pipeline, stated rather than hidden:**
# GitHub fans the 55 crates out across a job matrix built at runtime from
# `scripts/ci-crates.sh`. Woodpecker's `matrix:` needs a *static* list,
# which would silently drift from the tree every time a crate is added — so
# these steps loop over the discovered crates in one job instead. Same
# commands and same coverage; slower, and a failure report that names every
# failing crate at the end rather than one job per crate.

when:
  - event: [push, pull_request, manual]

variables:
  # Matches rust-toolchain.toml (1.96.1); rustup honours the pin from the
  # file, so the image tag only needs to be recent enough to bootstrap it.
  - &rust_image 'rust:1.96-bookworm'

services:
  - name: postgres
    image: postgres:18
    environment:
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
      POSTGRES_DB: postgres

steps:
  - name: rustfmt
    image: *rust_image
    commands:
      - rustup component add rustfmt
      - scripts/ci-check.sh fmt

  # Repo-wide convention checks (no build): the agents directory is
  # lowercase. Reads the git index, not the filesystem.
  - name: docs
    image: *rust_image
    commands:
      - scripts/ci-check.sh docs

  - name: clippy
    image: *rust_image
    commands:
      - rustup component add clippy
      - scripts/ci-check.sh clippy

  - name: test
    image: *rust_image
    commands:
      - scripts/ci-check.sh test

  # Criterion harnesses, compile-only. Numbers measured on shared CI
  # hardware would not be worth trusting; a bench that no longer builds
  # is worth catching here.
  - name: bench
    image: *rust_image
    commands:
      - scripts/ci-check.sh bench

  # Minimum Supported Rust Version — current stable minus three
  # (spec/rust-msrv-n-minus-3.md). The stage asserts every crate's
  # `rust-version` equals ci/msrv.txt, then compiles it against that
  # toolchain; the version is read from the file rather than written here
  # so a bump touches one place.
  - name: msrv
    image: *rust_image
    commands:
      - msrv=$(grep -v '^[[:space:]]*#' ci/msrv.txt | grep -v '^[[:space:]]*$' | head -1 | tr -d '[:space:]')
      - rustup toolchain install "$msrv" --profile minimal
      - scripts/ci-check.sh msrv

  # The `#[ignore]`-gated suites, against a real database. These are where
  # the compliance controls are actually proven; see ci/db-suites.txt for
  # why enrolment is an allowlist.
  - name: test-db
    image: *rust_image
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
    commands:
      - apt-get update && apt-get install -y --no-install-recommends postgresql-client
      - until pg_isready -h postgres -U loco; do sleep 1; done
      - scripts/ci-check.sh test-db

  - name: supply-chain
    image: *rust_image
    commands:
      - cargo install cargo-deny --locked
      - scripts/ci-check.sh deny
      - scripts/ci-check.sh evidence

  # Coverage-guided libFuzzer smoke run (SEC-I2) — short, fixed-time-bound
  # runs of every matcher/authentication-verifier/person-bulk fuzz target,
  # not exhaustive fuzzing. Needs nightly on top of the pinned stable
  # image; a no-op for every crate without a fuzz_targets/ directory. See
  # .github/workflows/fuzz.yml for why this runs on its own cadence there
  # (weekly + push/PR) rather than only here — Woodpecker has no inline
  # cron equivalent, so this step runs on every triggering event.
  - name: fuzz-smoke
    image: *rust_image
    commands:
      - rustup toolchain install nightly
      - cargo install cargo-fuzz --locked
      - scripts/ci-check.sh fuzz
