[package]
name = "thing-service"
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Thing Service - A thing administration microservice that interoperates with the thing-matcher crate"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/main-x-service/tree/main/thing/thing-service-with-axum"
keywords = ["thing-matcher", "microservice"]
categories = ["database"]

[[bin]]
name = "thing-service"
path = "src/bin/main.rs"

[dependencies]
# Keyed integrity MACs with production-grade key handling — one audited
# implementation shared by every service, rather than a copy per crate.
integrity-mac = { path = "../../integrity/integrity-mac-rust-crate" }
# Unkeyed content digests: SHA-256 (FIPS 180-4) and SHA3-256 (FIPS 202),
# kept for structural diversity — a Merkle-Damgard chain and a sponge,
# so an advance against one design family does not transfer.
sha2 = { version = "0.11" }
sha3 = { version = "0.12" }
# Async Runtime
tokio = { version = "1.54", features = ["full"] }

# Web Framework & HTTP (axum 0.8, matching axa)
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tower = { version = "0.5", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }

# Database: sqlx directly, no ORM. Every statement is a `query!` /
# `query_as!` literal in `src/db/`, checked at compile time against the
# committed `.sqlx/` data (spec/tech-stack §5). The same driver axa's
# `sqlx` feature already pulls in, so this adds no new database stack.
# Timestamps map to `chrono`, which the domain models and axa already use:
# with sqlx's `time` feature on as well, sqlx 0.9.0's macros warn on every
# timestamp column.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "uuid", "chrono", "json"] }
bigdecimal = { version = "0.4", features = ["serde"] }

axa = { version = "0.9", features = ["sqlx", "openapi", "opentelemetry", "versioning", "ratelimit", "cursor-pagination"] }

# Search Engine
tantivy = "0.27"

# gRPC
tonic = { version = "0.12", features = ["transport", "codegen", "prost"] }

# OpenAPI Documentation
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }

# Data Streaming

tracing = "0.1"
getrandom = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1.29", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
thiserror = "2.0"
dotenvy = "0.15"
async-trait = "0.1"

# Fuzzy Matching & String Processing
strsim = "0.11"

# Prometheus metrics (text exposition for /metrics.prom)
prometheus = "0.14"

# Sibling matcher crate
thing-matcher = { version = "0.7.0", path = "../thing-matcher-rust-crate" }

# Security
# Offline PASETO v4.public verification of authentication-service tokens
# against its published Ed25519 key set (`/.well-known/paseto-keys`) — no
# shared secret, no per-request introspection hop (local path — the
# monorepo's 0.2 PASETO verifier). The `fetch` feature adds the boot-time
# HTTP key-set fetch (`Verifier::from_paseto_keys_url`) used when
# `THING_PASETO_KEYS_URL` is set.
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", default-features = false }
mimalloc = "0.1.52"

# Durable event bus Phase 3 (BUS-3; agents/share/event-bus.md §5/§8):
# the relay's real broker sink. Optional and behind the `fluvio` feature
# below so the default dependency tree (and every existing deployment's
# build) is unchanged — the relay's `LoggingSink` covers dev/CI with no
# broker at all.
fluvio = { version = "0.50", optional = true }

[features]
# PASETO bearer verification (the family default): `Verifier`, the boot key
# fetch and the rotation refresh. Turn it off (`--no-default-features`) for a
# deployment whose only bearer credential is a Keycloak access token.
default = ["paseto"]
paseto = ["authentication-verifier/paseto", "authentication-verifier/fetch"]
# Also accept Keycloak (OIDC) access tokens, configured by
# `THING_KEYCLOAK_*` (see src/api/rest/auth.rs). Off by default.
keycloak = ["authentication-verifier/keycloak"]
# Off by default. The relay's `EventSink` seam (src/relay.rs) needs no
# feature to build or test; only `FluvioSink` — the real-broker producer
# — lives behind this.
fluvio = ["dep:fluvio"]

[dev-dependencies]
axa = { version = "0.9", features = ["sqlx", "testing", "openapi", "opentelemetry", "versioning", "ratelimit", "cursor-pagination"] }
# A local OIDC provider so tests/keycloak_guard.rs can push a Keycloak access
# token through the real guard without a Keycloak container. Tests only.
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", default-features = false, features = ["test-idp"] }
# Testing
assertables = "10"
tokio-test = "0.4"
mockall = "0.15"
tempfile = "3.27"

# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the bearer-verification path is exercised without the auth service or
# any network dependency.
ed25519-dalek = { version = "3.0" }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
base64 = { version = "0.23" }
# The activation proof (tests/enforcement.rs) sets process-wide env vars
# before booting the router, so it must not run beside another test in
# the same process; `tower` drives that router with `oneshot`.
serial_test = "4.0.1"
tower = { version = "0.5", features = ["util"] }

# Benchmarking
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

# An in-process OTLP/gRPC collector for `tests/otlp_export.rs`: the
# generated `TraceServiceServer` / `MetricsServiceServer` plus tonic's
# server transport, so the service's OTLP wiring is proved against a real
# gRPC listener in a normal `cargo test` run — no external collector,
# nothing `#[ignore]`d. This `tonic` (0.14, the line `opentelemetry-proto`
# generates against) is deliberately a different major version from this
# crate's main `tonic = "0.12"` dependency — Cargo links both without
# conflict since they are separate crates to the compiler.
opentelemetry-proto = { version = "0.33", default-features = false, features = [
  "gen-tonic",
  "trace",
  "metrics",
] }
# Renamed (`package = "tonic"`), not a plain `tonic = "0.14"` dev-dependency:
# this crate declares `tonic = "0.12"` in [dependencies] (dead weight
# today — T-3's not-yet-built gRPC server; `agents/share/overview.md`'s
# capability matrix correctly shows `–` on the gRPC-stub row because no
# `src/api/grpc` module exists yet, but a *declared* dependency collides
# in the extern prelude regardless of whether any code actually calls
# `tonic::` — see `agents/share/observability.md` for the general note,
# found rolling this to place, PRO-H12 slice 2). A regular dependency
# plus a dev-dependency sharing the unrenamed name `tonic` at two
# different versions makes rustc refuse the test binary with `E0464:
# multiple candidates for rlib dependency tonic`. The renamed crate is
# still exactly `tonic` 0.14.6 underneath — the same build
# `opentelemetry-proto`'s own `tonic` 0.14 dependency resolves to — so
# `otlp_test_tonic::Response<T>` and the generated
# `opentelemetry_proto::tonic::...` types are the same types; only the
# `use` path in the test files changes.
otlp-test-tonic = { package = "tonic", version = "0.14" }
tokio-stream = { version = "0.1", features = ["net"] }
# `tests/otlp_export.rs` makes a real HTTP request against a served
# router.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }

[build-dependencies]
# gRPC code generation
tonic-build = "0.14"

[[bench]]
name = "matching_bench"
harness = false

[[bench]]
name = "searching_bench"
harness = false

[[bench]]
name = "validation_bench"
harness = false

[[bench]]
name = "database_reading_bench"
harness = false

[[bench]]
name = "database_writing_bench"
harness = false

[[bench]]
name = "privacy_bench"
harness = false


[[bench]]
name = "bridge_bench"
harness = false
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Proc macros and build scripts are not stripped. With `strip = true`
# reaching them, macOS refuses to load the stripped `sqlx-macros` dylib
# ("mis-aligned LINKEDIT string pool") and a release build fails. The
# shipped binary is still stripped; only host-side build tools are not.
[profile.release.build-override]
strip = false

[profile.bench]
inherits = "release"
