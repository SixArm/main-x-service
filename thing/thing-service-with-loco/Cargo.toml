[package]
name = "thing-service"
version = "0.6.0"
edition = "2024"
rust-version = "1.96"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Thing Service - A thing administration microservice that interoperates with the thing-matcher crate"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/main-x-service/tree/main/thing/thing-service-with-loco"
keywords = ["thing-matcher", "microservice"]
categories = ["database"]

[[bin]]
name = "thing-service"
path = "src/bin/main.rs"

[dependencies]
# Keyed integrity MACs with production-grade key handling — one audited
# implementation shared by every service, rather than a copy per crate.
integrity-mac = { path = "../../integrity/integrity-mac-rust-crate" }
# Unkeyed content digests: SHA-256 (FIPS 180-4) and SHA3-256 (FIPS 202),
# kept for structural diversity — a Merkle-Damgard chain and a sponge,
# so an advance against one design family does not transfer.
sha2 = { version = "0.10" }
sha3 = { version = "0.10" }
# Async Runtime
tokio = { version = "1.53", features = ["full"] }

# Web Framework & HTTP (axum 0.8 to match loco 0.16)
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }

# Database (PostgreSQL ORM)
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-time", "with-uuid", "with-json"] }
bigdecimal = { version = "0.4", features = ["serde"] }

# Web Framework (Loco conventions; web/template tier removed)
# `auth` is deliberately absent from this feature list. It is loco's JWT
# support (`dep:jsonwebtoken`, and therefore `rsa` / RUSTSEC-2023-0071),
# and this family issues PASETO v4.public rather than JWT — see
# agents/share/jwt.md. Dropping it removes the vulnerable crate from the
# dependency graph rather than suppressing the advisory.
loco-rs = { version = "1.1.0", default-features = false, features = ["cli", "with-db", "cache_inmem", "worker"] }
migration = { path = "migration" }

# Search Engine
tantivy = "0.22"

# gRPC
tonic = { version = "0.12", features = ["transport", "codegen", "prost"] }

# OpenAPI Documentation
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Data Streaming

# OpenTelemetry (Observability) — real OTLP export (PRO-H12, ported from
# person-service — see src/observability.rs's module docs). These were
# previously stale 0.27/0.28 pins with zero consumers (no
# src/observability module existed at all until this change). `grpc-tonic`
# (not the crate's default `http-proto` + blocking reqwest): the shared
# doc's `OTLP_ENDPOINT` default is `http://localhost:4317`, the gRPC
# port. `internal-logs` is kept ON so a failing export is visible in the
# log rather than silently dropped. No `logs` feature — this pipeline is
# traces + metrics only.
opentelemetry = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "grpc-tonic",
  "trace",
  "metrics",
  "internal-logs",
] }
opentelemetry-semantic-conventions = { version = "0.32" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.33" }

# Utilities
uuid = { version = "1.24", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
thiserror = "2.0"
dotenvy = "0.15"
async-trait = "0.1"

# Fuzzy Matching & String Processing
strsim = "0.11"

# Prometheus metrics (text exposition for /metrics.prom)
prometheus = "0.13"

# Sibling matcher crate
thing-matcher = { version = "0.7.0", path = "../thing-matcher-rust-crate" }

# Security
# Offline PASETO v4.public verification of authentication-service tokens
# against its published Ed25519 key set (`/.well-known/paseto-keys`) — no
# shared secret, no per-request introspection hop (local path — the
# monorepo's 0.2 PASETO verifier). The `fetch` feature adds the boot-time
# HTTP key-set fetch (`Verifier::from_paseto_keys_url`) used when
# `THING_PASETO_KEYS_URL` is set.
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", features = ["fetch"] }
mimalloc = "0.1.52"

# Durable event bus Phase 3 (BUS-3; agents/share/event-bus.md §5/§8):
# the relay's real broker sink. Optional and behind the `fluvio` feature
# below so the default dependency tree (and every existing deployment's
# build) is unchanged — the relay's `LoggingSink` covers dev/CI with no
# broker at all.
fluvio = { version = "0.50", optional = true }

[features]
# Off by default. The relay's `EventSink` seam (src/relay.rs) needs no
# feature to build or test; only `FluvioSink` — the real-broker producer
# — lives behind this.
fluvio = ["dep:fluvio"]

[dev-dependencies]
# Testing
assertables = "10"
tokio-test = "0.4"
mockall = "0.13"
tempfile = "3.27"

# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the bearer-verification path is exercised without the auth service or
# any network dependency.
ed25519-dalek = { version = "2.2" }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
base64 = { version = "0.22" }
# The activation proof (tests/enforcement.rs) sets process-wide env vars
# before booting the router, so it must not run beside another test in
# the same process; `tower` drives that router with `oneshot`.
serial_test = "4.0"
tower = { version = "0.5", features = ["util"] }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# An in-process OTLP/gRPC collector for `tests/otlp_export.rs` /
# `tests/otlp_middleware.rs` (PRO-H12, ported from person-service): the
# generated `TraceServiceServer` / `MetricsServiceServer` plus tonic's
# server transport, so the export pipeline is proved against a real gRPC
# listener in a normal `cargo test` run — no external collector, nothing
# `#[ignore]`d. This `tonic` (0.14, from opentelemetry-otlp's own
# `grpc-tonic` line) is deliberately a different major version from this
# crate's main `tonic = "0.12"` dependency — Cargo links both without
# conflict since they are separate crates to the compiler; there is no
# version to unify.
opentelemetry-proto = { version = "0.32", default-features = false, features = [
  "gen-tonic",
  "trace",
  "metrics",
] }
# Renamed (`package = "tonic"`), not a plain `tonic = "0.14"` dev-dependency:
# this crate declares `tonic = "0.12"` in [dependencies] (dead weight
# today — T-3's not-yet-built gRPC server; `agents/share/overview.md`'s
# capability matrix correctly shows `–` on the gRPC-stub row because no
# `src/api/grpc` module exists yet, but a *declared* dependency collides
# in the extern prelude regardless of whether any code actually calls
# `tonic::` — see `agents/share/observability.md` for the general note,
# found rolling this to place, PRO-H12 slice 2). A regular dependency
# plus a dev-dependency sharing the unrenamed name `tonic` at two
# different versions makes rustc refuse the test binary with `E0464:
# multiple candidates for rlib dependency tonic`. The renamed crate is
# still exactly `tonic` 0.14.6 underneath — the same build
# `opentelemetry-proto`'s own `tonic` 0.14 dependency resolves to — so
# `otlp_test_tonic::Response<T>` and the generated
# `opentelemetry_proto::tonic::...` types are the same types; only the
# `use` path in the test files changes.
otlp-test-tonic = { package = "tonic", version = "0.14" }
tokio-stream = { version = "0.1", features = ["net"] }
# The mounted-middleware test (`tests/otlp_middleware.rs`) makes a real
# HTTP request against a served router.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

[build-dependencies]
# gRPC code generation
tonic-build = "0.12"

[[bench]]
name = "matching_bench"
harness = false

[[bench]]
name = "searching_bench"
harness = false

[[bench]]
name = "validation_bench"
harness = false

[[bench]]
name = "database_reading_bench"
harness = false

[[bench]]
name = "database_writing_bench"
harness = false

[[bench]]
name = "privacy_bench"
harness = false


[[bench]]
name = "bridge_bench"
harness = false
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
