logger:
  enable: false
  pretty_backtrace: true
  level: error
  format: compact

server:
  port: 5151
  binding: 0.0.0.0
  host: http://localhost
  middlewares:
    # See development.yaml (SEC-M1 explicit backstop).
    limit_payload:
      enable: true
      body_limit: 2mb

workers:
  mode: ForegroundBlocking

database:
  # Credentials match CI (.github/workflows/ci.yml `test-db`) and the
  # container in compose.test.yaml, so the same URL works in all three
  # places. DATABASE_URL still wins where it is set.
  uri: {{ get_env(name="DATABASE_URL", default="postgres://loco:loco@localhost:5432/thing_service_test") }}
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 5
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: false

auth:
  jwt:
    secret: "test-only-secret"
    expiration: 604800
