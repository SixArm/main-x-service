logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5150
  binding: 0.0.0.0
  host: http://localhost

workers:
  mode: BackgroundQueue

mailer:
  smtp:
    # Disabled: these services send no mail. The host/port below are
    # still required — loco's config schema has them as non-optional
    # fields on the smtp struct, so omitting them fails to parse even
    # when `enable` is false, which stops the CLI booting entirely.
    enable: false
    host: localhost
    port: 1025
    secure: false

database:
  uri: {{ get_env(name="DATABASE_URL", default="postgres://localhost/thing_service_development") }}
  enable_logging: true
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 10
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

queue:
  kind: Postgres
  uri: {{ get_env(name="DATABASE_URL", default="postgres://localhost/thing_service_development") }}
  dangerously_flush: false

auth:
  jwt:
    secret: "PLEASE_CHANGE_ME_DEVELOPMENT_ONLY"
    expiration: 604800


# Cache provider: in-memory (loco `cache_inmem`, enabled by default).
cache:
  kind: InMem
  max_capacity: 33554432 # 32MiB (default if not specified)
