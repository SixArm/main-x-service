[package]
name = "thing-matcher"
version = "0.7.0"
edition = "2024"
rust-version = "1.96"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Deterministic and probabilistic matching of schema.org Thing records (name, alternateName, description, identifier, url, sameAs, additionalType) with explainable per-field score breakdowns."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/thing-matcher-rust-crate"
readme = "README.md"
keywords = ["schema-org", "thing", "matching", "deduplication", "record-linkage"]
categories = ["data-structures", "science"]
include = ["src/**/*", "LICENSE.md", "README.md", "CHANGELOG.md"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }
unicode-normalization = "0.1"
strsim = "0.11"
thiserror = "2.0"
soundex = "0.2"
mimalloc = "0.1.52"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.11"

[[bench]]
name = "match_pair"
harness = false
