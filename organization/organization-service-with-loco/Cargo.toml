[workspace]

[package]
name = "organization-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
default-run = "organization-service"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
# `auth` is deliberately absent from this feature list. It is loco's JWT
# support (`dep:jsonwebtoken`, and therefore `rsa` / RUSTSEC-2023-0071),
# and this family issues PASETO v4.public rather than JWT — see
# agents/share/jwt.md. Dropping it removes the vulnerable crate from the
# dependency graph rather than suppressing the advisory.
loco-rs = { version = "1.1.0", default-features = false, features = ["cli", "with-db", "cache_inmem", "worker"] }

[dependencies]
# Keyed integrity MACs with production-grade key handling — one audited
# implementation shared by every service, rather than a copy per crate.
integrity-mac = { path = "../../integrity/integrity-mac-rust-crate" }
# Unkeyed content digests: SHA-256 (FIPS 180-4) and SHA3-256 (FIPS 202),
# kept for structural diversity — a sponge and a Merkle-Damgard chain, so
# an advance against one design family does not transfer.
sha2 = { version = "0.10" }
sha3 = { version = "0.10" }
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
tokio = { version = "1.53", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.13" }
# Embedded full-text search index (see src/search/). Same version as the
# older services' `src/search/`, so the family runs one index format.
tantivy = { version = "0.22" }
# BLK-5 bulk import/export: the CSV codec (src/bulk/csv.rs). Same crate
# and major version the person/care-pathway bulk modules already use.
csv = "1"
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.24", features = ["v4", "serde"] }
include_dir = { version = "0.7" }
# Prometheus text-exposition metrics, served at `/metrics.prom` (see src/metrics.rs).
prometheus = { version = "0.13" }

# Faster memory allocator, used only for MUSL static builds (see src/bin/main.rs).
mimalloc = "0.1.52"

# Canonical matching algorithm — embedded and used directly as the API DTO.
organization-matcher = { path = "../organization-matcher-rust-crate" }

# Offline PASETO v4.public verification against the authentication-service
# published Ed25519 keys (local path — the monorepo's 0.2 PASETO verifier).
# The `fetch` feature adds `Verifier::from_paseto_keys_url` for the boot-time
# key-set fetch (`ORGANIZATION_PASETO_KEYS_URL`; see src/auth.rs).
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", features = ["fetch"] }

# Durable event bus Phase 3 (BUS-3, ported from case-service's BUS-1
# reference; agents/share/event-bus.md §5/§8): the relay's real broker
# sink. Optional and behind the `fluvio` feature below so the default
# dependency tree (and every existing deployment's build) is unchanged —
# the relay's `LoggingSink` covers dev/CI with no broker at all.
fluvio = { version = "0.50", optional = true }

[features]
# Off by default. The relay's `EventSink` seam (src/relay.rs) needs no
# feature to build or test; only `FluvioSink` — the real-broker producer
# — lives behind this.
fluvio = ["dep:fluvio"]

[[bin]]
name = "organization-service"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
loco-rs = { workspace = true, features = ["testing"] }
# The `TestServer` loco's testing harness hands to a request test, and
# `multipart::{MultipartForm, Part}` for the BLK-5 bulk-import request
# tests (`tests/requests/bulk.rs`). Named explicitly so those tests can
# factor out helpers that take a `TestServer` and build multipart
# bodies — loco re-exports the harness function, not the type.
axum-test = { version = "17.3" }
serial_test = { version = "3.5.0" }
# Per-test throwaway index directories, so search unit tests never touch
# the process-wide index.
tempfile = { version = "3.27" }
rstest = { version = "0.25" }
insta = { version = "1.48", features = ["redactions", "yaml", "filters"] }
# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the extractor's happy path is verified un-gated (no auth-service /
# network dependency).
ed25519-dalek = { version = "2.2" }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
sha2 = { version = "0.10" }
base64 = { version = "0.22" }
# `macros` + `net` power the boot-time key-set fetch tests in src/auth.rs
# (#[tokio::test] + an ephemeral-port TcpListener serving the key set).
tokio = { version = "1.53", default-features = false, features = [
  "macros",
  "net",
  "rt-multi-thread",
  # `time` lets the boot-reindex test await a spawned background task
  # instead of busy-waiting.
  "time",
] }

[[bench]]
name = "service_bench"
harness = false
