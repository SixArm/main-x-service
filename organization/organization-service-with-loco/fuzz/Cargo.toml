# Its own workspace root. The parent crate declares `[workspace]`, which
# would otherwise pull `fuzz/` in as a member — and a cargo-fuzz build
# needs its own sanitizer flags and lockfile, not the service's.
[workspace]

[package]
name = "organization-service-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
organization-matcher = { path = "../../organization-matcher-rust-crate" }

[dependencies.organization-service]
path = ".."

# cargo-fuzz scaffolding for this service's pure request-path logic
# (SEC-I2 / FUZZ-2). `validation::problems` and `merge::merge_orgs` run on
# the request body — attacker-controlled JSON — and are pure and total, so
# they fuzz without a database. Not a member of any parent workspace, so it
# never affects the crate's normal build/test/clippy, and it carries no
# `rust-version`: cargo-fuzz is nightly-only
# (spec/rust-msrv-n-minus-3.md §2).

[[bin]]
name = "validate_json"
path = "fuzz_targets/validate_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_built"
path = "fuzz_targets/validate_built.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merge_orgs"
path = "fuzz_targets/merge_orgs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bulk_decoders"
path = "fuzz_targets/bulk_decoders.rs"
test = false
doc = false
bench = false
