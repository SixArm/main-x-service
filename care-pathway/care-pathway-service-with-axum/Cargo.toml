[workspace]

[package]
name = "care-pathway-service"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false
default-run = "care-pathway-service"
description = "Care pathway service — clinical care-pathway registry that interoperates with the care-pathway-matcher crate"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axa = { version = "0.8", features = ["sqlx", "queue", "openapi", "opentelemetry", "versioning", "ratelimit", "cursor-pagination"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
getrandom = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.13" }
# Embedded full-text search index (see src/search/). Same version as the
# rest of the family, so one index format.
tantivy = { version = "0.27" }
# Database: sqlx directly, no ORM. Every statement is a `query!` /
# `query_as!` / `query_scalar!` literal in `src/models/`, checked at
# compile time against the committed `.sqlx/` data (spec/tech-stack §5).
# The same driver axa's `sqlx` feature already pulls in, so this adds no
# new database stack. Timestamps map to `chrono`: with sqlx's `time`
# feature on as well, sqlx 0.9.0's macros warn on every timestamp column.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "uuid", "chrono", "json"] }
# `serde` for the timestamps the rows serialize (audit, merge, links,
# instances, segments); `SeaORM` used to turn it on.
chrono = { version = "0.4", features = ["serde"] }
# The cross-service-linking contract: the `EntityRef` URN value type and
# the closed v1 `EdgeKind` registry. A path dependency like every other
# consumer — see agents/share/cross-service-linking.md §12.
entity-ref = { path = "../../link/entity-ref-rust-crate" }
# Server-side peer fetches for the stitched-journey traversal
# (`src/journey.rs`). The only hosts ever contacted are the
# operator-configured `CARE_PATHWAY_JOURNEY_URL_<TYPE>` bases, and the
# client is built non-redirecting so a peer cannot steer it elsewhere
# (SEC-B11).
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
validator = { version = "0.21" }
uuid = { version = "1.29", features = ["v4", "serde"] }
include_dir = { version = "0.7" }
mimalloc = { version = "0.1.52" }
# Prometheus metrics registry + text-exposition rendering for /metrics.prom.
prometheus = { version = "0.14" }
# SHA-256 for the tamper-evident audit hash chain (HIPAA §164.312(c)).
# See src/compliance/audit_chain.rs.
sha2 = { version = "0.11" }
# Second integrity digest. SHA-3 (FIPS 202) is a **sponge** construction,
# structurally unrelated to SHA-256's Merkle-Damgard chaining, so a
# cryptanalytic advance against one design family does not transfer to
# it. See spec/12-compliance.md §12.4z.
sha3 = { version = "0.12" }
# Keyed integrity (HMAC-SHA256, FIPS 198-1) over the same pre-image, with
# a key the database never holds — see spec/12-compliance.md §12.4z. This
# is what raises tamper detection above "careless modification": the
# unkeyed digests are forgeable by anyone who can write SQL, since their
# format is published.
# Keyed integrity MACs with production-grade key handling — one audited
# implementation shared by every service, rather than a copy per crate.
integrity-mac = { path = "../../integrity/integrity-mac-rust-crate" }
# HKDF-SHA256 (RFC 5869) derives a per-(service, domain) subkey from the
# configured MAC root key, so a tag cannot transfer between purposes, or
# between two services sharing one cluster-wide key. See
# src/compliance/mac.rs and spec/12-compliance.md §12.4z.
# Wipes the root key from memory once the domain subkeys are derived, so
# it does not survive in core dumps or swap.
# OS entropy for the integrity_key task. The operating system CSPRNG
# directly, not a userspace PRNG: no seeding question and no fork hazard
# for a key that lives for months.

# Canonical matching algorithm — embedded and used directly as the API DTO.
care-pathway-matcher = { path = "../care-pathway-matcher-rust-crate" }

# Offline PASETO v4.public verification against the authentication-service Ed25519 keys (local path; monorepo 0.2 verifier).
# The `fetch` feature adds `Verifier::from_paseto_keys_url` for the boot-time
# key-set fetch (`CARE_PATHWAY_PASETO_KEYS_URL`; see src/auth.rs).
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", default-features = false }

# CSV/TSV codec for the native bulk import/export API (§13 T-10;
# src/bulk/csv.rs). Same version as organization's/case's own BLK-5.
csv = "1"

# S3-compatible artifact storage for bulk jobs (optional).
#
# The maintained AWS SDK rather than hand-rolled SigV4 signing: signing is
# security-relevant code, and there is no way to verify a hand-rolled
# implementation in this repository's test environment without a live
# endpoint. Optional so the default dependency tree — and the default
# build time — is unchanged for deployments using the local backend.
aws-config = { version = "1", optional = true, default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "default-https-client",
] }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "default-https-client",
  "sigv4a",
] }
aws-credential-types = { version = "1", optional = true }

# Durable event bus Phase 3 (BUS-3; agents/share/event-bus.md §5/§8):
# the relay's real broker sink. Optional and behind the `fluvio` feature
# below so the default dependency tree (and every existing deployment's
# build) is unchanged — the relay's `LoggingSink` covers dev/CI with no
# broker at all.
fluvio = { version = "0.50", optional = true }

[[bin]]
name = "care-pathway-service"
path = "src/bin/main.rs"
required-features = []

[features]
# PASETO bearer verification (the family default): `Verifier`, the boot key
# fetch and the rotation refresh. Turn it off (`--no-default-features`) for a
# deployment whose only bearer credential is a Keycloak access token.
default = ["paseto"]
paseto = ["authentication-verifier/paseto", "authentication-verifier/fetch"]
# Also accept Keycloak (OIDC) access tokens, configured by
# `CARE_PATHWAY_KEYCLOAK_*` (see src/auth.rs). Off by default.
keycloak = ["authentication-verifier/keycloak"]
# S3-compatible artifact storage. Off by default: the local-filesystem
# backend covers dev and test, and the SDK is a large dependency tree no
# deployment should pay for unless it uses it.
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-credential-types"]
# Off by default. The relay's `EventSink` seam (src/relay.rs) needs no
# feature to build or test; only `FluvioSink` — the real-broker producer
# — lives behind this.
fluvio = ["dep:fluvio"]

[dev-dependencies]
# A local OIDC provider so tests/keycloak_guard.rs can push a Keycloak access
# token through the real guard without a Keycloak container. Tests only.
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", default-features = false, features = ["test-idp"] }
criterion = { version = "0.8", features = ["html_reports"] }
# Temp dirs for the artifact-store tests (SEC-B4 confinement).
tempfile = "3"
axa = { version = "0.8", features = ["sqlx", "queue", "testing", "openapi", "opentelemetry", "versioning", "ratelimit", "cursor-pagination"] }
# The `TestServer` axa's testing harness hands to a request test. Named
# explicitly so request tests can factor out helpers that take one (axa
# re-exports the type, `axa::TestServer`, but not the `multipart`
# module the native-bulk import tests need — `src/bulk/handlers.rs`'s
# multipart upload). Pinned to the exact version loco-rs 1.1.0 depends on
# internally (matching organization-service's own pin) so this crate
# does not carry two incompatible copies of `axum-test` at once — an
# unrelated stale "21.1" pin here duplicated the crate until this fix;
# `axa::TestServer` and this dependency's own `TestServer` must name
# the same type for a helper to accept either interchangeably.
axum-test = "21"
serial_test = { version = "4.0.1" }
rstest = { version = "0.28" }
insta = { version = "1.49", features = ["redactions", "yaml", "filters"] }
# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so the extractor.s
# happy path is verified un-gated (no auth-service / network dependency).
ed25519-dalek = { version = "3.0" }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
sha2 = { version = "0.11" }
base64 = { version = "0.23" }
# `macros` + `net` power the boot-time key-set fetch tests in src/auth.rs
# (#[tokio::test] + an ephemeral-port TcpListener serving the key set).
# `time` lets tests/otlp_collector's `wait_for` poll with `tokio::time::sleep`
# instead of busy-waiting.
tokio = { version = "1.54", default-features = false, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }

# An in-process OTLP/gRPC collector for `tests/otlp_export.rs`: the
# generated `TraceServiceServer` / `MetricsServiceServer` plus tonic's
# server transport, so the service's OTLP wiring is proved against a real
# gRPC listener in a normal `cargo test` run — no external collector,
# nothing `#[ignore]`d. The test's HTTP request uses the main `reqwest`
# dependency.
opentelemetry-proto = { version = "0.33", default-features = false, features = [
  "gen-tonic",
  "trace",
  "metrics",
] }
# Plain `tonic`, not a renamed `package = "tonic"` dev-dependency like
# person/worker/event needed: this crate carries no gRPC stub of its own,
# so there is no `E0464` extern-prelude collision to dodge.
tonic = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }

[[bench]]
name = "service_bench"
harness = false

# Proc macros and build scripts are not stripped. When stripping reaches
# them, macOS refuses to load the stripped `sqlx-macros` dylib
# ("mis-aligned LINKEDIT string pool") and a release build fails. Only
# host-side build tools are affected; the shipped binary is unchanged.
[profile.release.build-override]
strip = false
