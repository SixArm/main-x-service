[package]
name = "care-pathway-matcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Care-pathway matcher — pairwise clinical care-pathway record matching with weighted fuzzy + deterministic strategies"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/main-x-service/tree/main/care-pathway/care-pathway-matcher-rust-crate"
keywords = ["care-pathway", "clinical-pathway", "matching", "identity"]
categories = ["algorithms", "text-processing"]

[lib]
name = "care_pathway_matcher"
path = "src/lib.rs"

[[bin]]
name = "care-pathway-matcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }
strsim = "0.11"
unicode-normalization = "0.1"
thiserror = "2.0"
mimalloc = "0.1.52"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bench]]
name = "match_pair"
harness = false

# Faster dev builds: line tables are enough for backtraces and panics, and
# dependencies carry no debug info at all.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
# Without this, cargo strips debug info from proc-macro dylibs (sqlx-macros),
# and macOS then refuses to load them.
strip = "none"

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
