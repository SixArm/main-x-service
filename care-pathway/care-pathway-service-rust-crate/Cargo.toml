[workspace]

[package]
name = "care-pathway-service"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "care-pathway-service"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "0.16" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.52", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.12" }
migration = { path = "migration" }
sea-orm = { version = "1.1", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.23", features = ["v4", "serde"] }
include_dir = { version = "0.7" }
mimalloc = { version = "0.1.52" }

# Canonical matching algorithm — embedded and used directly as the API DTO.
care-pathway-matcher = { path = "../care-pathway-matcher-rust-crate" }

# Offline RS256 JWT verification against the authentication-service JWKS.
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate" }

[[bin]]
name = "care-pathway-service"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.5.0" }
rstest = { version = "0.25" }
insta = { version = "1.48", features = ["redactions", "yaml", "filters"] }
# Mint RS256 tokens + a matching JWKS in-process so the JWT extractor's
# happy path is verified un-gated (no auth-service / network dependency).
jsonwebtoken = { version = "9" }
rsa = { version = "0.9", features = ["pem"] }
sha2 = { version = "0.10" }
base64 = { version = "0.22" }
