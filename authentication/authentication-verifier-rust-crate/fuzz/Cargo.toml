[package]
name = "authentication-verifier-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }

[dependencies.authentication-verifier]
path = ".."

# cargo-fuzz scaffolding for the offline PASETO verifier + ABAC engine
# (SEC-I2). Both entry points here process attacker-controlled input — a
# peer's bearer token and a deployment's policy config — so they are prime
# never-panic targets (crate golden rule #5). Run on nightly:
# `cargo +nightly fuzz run verify`. Not a member of any parent workspace, so
# it never affects the crate's normal build/test/clippy.

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy"
path = "fuzz_targets/policy.rs"
test = false
doc = false
bench = false
