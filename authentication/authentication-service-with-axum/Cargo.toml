[workspace]

[package]
name = "authentication-service"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
publish = true
default-run = "authentication-service-cli"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Authentication service."
readme = "README.md"
repository = "https://github.com/sixarm/main-x-service"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["auth", "authentication", "logon", "signin"]
categories = ["development-tools", "rust-patterns"]
include = ["src/**/*", "LICENSE.md", "README.md", "llms.txt", "llms.json"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Keyed integrity MACs with production-grade key handling — one audited
# implementation shared by every service. Distinct from the PASETO
# signing key: this secret never leaves the service.
integrity-mac = { path = "../../integrity/integrity-mac-rust-crate" }
# Unkeyed content digests over the audit pre-image, written even when
# no MAC key is configured — a sponge and a Merkle-Damgard chain, so
# an advance against one design family does not transfer.
sha2 = { version = "0.11" }
sha3 = { version = "0.12" }
axa = { version = "0.8", features = ["sqlx", "openapi", "versioning", "ratelimit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
] }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.13" }
# Database: sqlx directly, no ORM. Every statement is a `query!` /
# `query_as!` / `query_scalar!` literal in `src/models/`, checked at
# compile time against the committed `.sqlx/` data (spec/tech-stack §5).
# The same driver axa's `sqlx` feature already pulls in, so this adds no
# new database stack. The schema is the plain SQL under `migrations/`.
# Timestamps map to `chrono`: with sqlx's `time` feature on as well,
# sqlx 0.9.0's macros warn on every timestamp column.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "uuid", "chrono", "json"] }
# `serde` for the timestamps the account export and the audit feed
# serialize; `SeaORM` used to turn it on.
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }
uuid = { version = "1.29", features = ["serde", "v4"] }
# PASETO v4.public token signing + Ed25519 public-key publication. As the
# central auth provider, other services verify tokens offline against the
# published Ed25519 keys at /.well-known/paseto-keys — no shared secret,
# no introspection hop. (Supersedes the prior RS256-JWT + JWKS model.)
# Optional: gated by the default-on `paseto` feature.
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"], optional = true }
ed25519-dalek = { version = "3.0", optional = true }
base64 = { version = "0.23" }
# Prometheus text-exposition metrics served at GET /metrics.prom, for
# parity with the older Axum services in the family.
prometheus = { version = "0.14" }
# Magic-link email over SMTP.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
# The deliberately slow hash for SEC-A5, and CSRF token generation.
argon2 = { version = "0.5", features = ["std"] }
rand = "0.9"

[features]
# PASETO v4.public token issuance (`POST /api/auth/token`), the published
# key set (`GET /.well-known/paseto-keys`), and bearer-token verification
# for the bearer-gated routes. ON by default: a default build is
# unchanged. Without it the service still runs sessions, magic links,
# (with `oidc`) OIDC federation, admin attributes and GDPR routes — those
# routes authenticate by the session cookie instead of a bearer token —
# but issues no tokens and serves neither route (404). There is no
# `keycloak` feature here: this crate federates Keycloak through `oidc`.
default = ["paseto"]
paseto = ["dep:rusty_paseto", "dep:ed25519-dalek"]
# EV-2: SAML 2.0 / OIDC enterprise identity federation (design:
# agents/share/authentication-sessions.md §7a). Off by default so a
# deployment that does not federate pulls in no extra HTTP/crypto
# stack — the same posture `authentication-verifier`'s own `fetch`
# feature takes for its boot-time key-set fetch.
oidc = ["dep:openidconnect", "dep:reqwest", "dep:url"]

[dependencies.openidconnect]
version = "4"
optional = true
default-features = false
features = ["reqwest"]

[dependencies.reqwest]
version = "0.13"
optional = true
default-features = false
features = ["rustls", "json"]

[dependencies.url]
version = "2"
optional = true

# musl release builds use mimalloc as the global allocator (see
# src/bin/main.rs); gated by target so normal glibc/macOS builds do not
# pull it in. cfg(target_env = "musl") matches musl-libc targets.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[[bin]]
name = "authentication-service-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
# The peer-side verifier library (local path — the monorepo's 0.2 PASETO
# verifier, not the published 0.1). Used by tests/sign_verify_contract.rs
# to pin the duplicated-by-convention Claims shape and footer-kid contract:
# this service signs PASETO v4.public, the verifier crate verifies, the
# claims round-trip.
authentication-verifier = { path = "../authentication-verifier-rust-crate", default-features = false, features = ["paseto"] }
axa = { version = "0.8", features = ["sqlx", "testing", "openapi", "versioning", "ratelimit"] }
serial_test = { version = "4.0.1" }
rstest = { version = "0.28" }
insta = { version = "1.49", features = ["redactions", "yaml", "filters"] }
# T-EV-2 test-only: a stub OIDC provider in `tests/oidc.rs` signs its
# ID tokens with ES256 (P-256 ECDSA), a pure-Rust implementation with
# no `rsa`/RUSTSEC-2023-0071 exposure (the family removed `jsonwebtoken`
# for exactly that advisory — see `security.md` §7's 2026-08-21 entry).
# Dev-only: never shipped in the service itself.
p256 = { version = "0.14", features = ["ecdsa"] }
axum-test = { version = "17.3.0" }

# Proc macros and build scripts are not stripped. When stripping reaches
# them, macOS refuses to load the stripped `sqlx-macros` dylib
# ("mis-aligned LINKEDIT string pool") and a release build fails. Only
# host-side build tools are affected; the shipped binary is unchanged.
[profile.release.build-override]
strip = false
