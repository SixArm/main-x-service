# cargo-deny supply-chain policy (SEC-I1). Used by the `security.yml`
# workflow's `cargo deny check` step. Copied per crate (drift-accepted,
# same posture as the other per-crate configs); keep the crates in sync
# when this policy changes.

[advisories]
version = 2
yanked = "warn"
# No advisory is ignored. The twelve this list used to carry came from
# the loco-era dependency tree; on axa + sqlx none of them is reached,
# and cargo-deny reported every one as `advisory-not-detected` (PF-D1).
# An ignore that matches nothing hides the next real advisory with the
# same id, so add one back only for an advisory this tree actually hits,
# with its reason.
ignore = []

[licenses]
version = 2
# Permissive licenses used across the Rust / axa stack. A dependency
# whose license is not listed FAILS the check — a deliberate signal to
# review a new license, not to silently accept it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Local, unpublished crates (the service itself)
# carry no `license` field and must not be license-checked.
private = { ignore = true }

[bans]
# Duplicate versions are a warning (the axa/sqlx stack pulls a few);
# not a hard failure, so the gate stays green while still surfacing bloat.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
