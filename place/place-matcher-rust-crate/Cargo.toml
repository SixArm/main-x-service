[package]
name = "place-matcher"
version = "0.7.1"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Deterministic and probabilistic matching of geographic places (Haversine distance, external place IDs, ISO 3166-1 alpha-2 country codes, categories) with explainable per-field score breakdowns."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/place-matcher-rust-crate"
readme = "README.md"
keywords = ["place", "matching", "geographic", "geocoding", "deduplication"]
categories = ["science", "data-structures"]
include = ["src/**/*", "LICENSE.md", "README.md", "CHANGELOG.md"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }
unicode-normalization = "0.1"
strsim = "0.11"
thiserror = "2.0"
soundex = "0.2"
mimalloc = "0.1.52"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.12"

[[bench]]
name = "match_pair"
harness = false

# Faster dev builds: line tables are enough for backtraces and panics, and
# dependencies carry no debug info at all.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
# Without this, cargo strips debug info from proc-macro dylibs (sqlx-macros),
# and macOS then refuses to load them.
strip = "none"

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
