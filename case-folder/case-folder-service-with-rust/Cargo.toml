[workspace]

[package]
name = "case-folder-service-with-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
default-run = "case-folder-service-with-rust-cli"
description = "Case folder service — NHS paper case-note folder location tracking with a barcode/QR/RFID move audit trail"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[dependencies]
axa = { version = "0.5" }

tokio = { version = "1.54", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.29", features = ["serde", "v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
# No crypto-backend feature: jsonwebtoken 10+ ships neither by
# default, and its only two built-in options are `rust_crypto` (which
# unconditionally bundles the `rsa` crate — RUSTSEC-2023-0071, the
# Marvin timing attack this family removed from the dependency graph
# on 2026-08-21, see `agents/share/security.md` §7 and the `auth`
# comment above) and `aws_lc_rs` (a C/asm crypto library this family
# has no other dependency on). This crate signs/verifies only HS256,
# so `src/auth/crypto.rs` installs a minimal custom `CryptoProvider`
# (the documented extension point) built on the `hmac`/`sha2` below —
# see that module's docs for the full reasoning.
jsonwebtoken = { version = "11", default-features = false }
hmac = "0.13"
sha2 = "0.11"

[[bin]]
name = "case-folder-service-with-rust-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
axa = { version = "0.5", features = ["testing"] }
serial_test = "4.0.1"
