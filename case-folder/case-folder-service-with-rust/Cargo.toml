[workspace]

[package]
name = "case-folder-service-with-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
default-run = "case-folder-service-with-rust-cli"
description = "Case folder service — NHS paper case-note folder location tracking with a barcode/QR/RFID move audit trail"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[workspace.dependencies]
# `auth` is deliberately absent from this feature list. It is loco's JWT
# support (`dep:jsonwebtoken`, and therefore `rsa` / RUSTSEC-2023-0071),
# and this family issues PASETO v4.public rather than JWT — see
# agents/share/jwt.md. Dropping it removes the vulnerable crate from the
# dependency graph rather than suppressing the advisory.
loco-rs = { version = "1.1.0", default-features = false, features = ["cli", "with-db", "cache_inmem", "worker"] }

[dependencies]
loco-rs = { workspace = true }
migration = { path = "migration" }

tokio = { version = "1.53", default-features = false, features = [
    "rt-multi-thread",
] }
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.24", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

sea-orm = { version = "2.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"

[[bin]]
name = "case-folder-service-with-rust-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = "3"
