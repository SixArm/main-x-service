[package]
name = "person-service"
version = "0.5.0"
edition = "2024"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Person Service - A person administration microservice that interoperates with the person-matcher crate"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/main-x-service/person-service-rust-crate"
keywords = ["person-matcher", "microservice"]
categories = ["database"]

[dependencies]
# Async Runtime
tokio = { version = "1.49", features = ["full"] }

# Web Framework & HTTP
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
hyper = { version = "1.8", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database (PostgreSQL ORM)
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
bigdecimal = { version = "0.4", features = ["serde"] }

# Web Framework (Loco conventions; web/template tier removed)
loco-rs = { version = "0.14", default-features = false, features = ["auth_jwt", "cli", "with-db", "cache_inmem", "bg_pg"] }

# Search Engine
tantivy = "0.22"

# gRPC
tonic = { version = "0.12", features = ["transport", "codegen", "prost"] }
prost = "0.13"

# OpenAPI Documentation
utoipa = { version = "5.4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8.1", features = ["axum"] }
openapiv3 = "2.2"

# Data Streaming
fluvio = "0.23"

# OpenTelemetry (Observability)
opentelemetry = { version = "0.27", features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.27", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace", "metrics", "logs"] }
opentelemetry-semantic-conventions = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"

# Utilities
uuid = { version = "1.19", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
validator = { version = "0.19", features = ["derive"] }
dotenvy = "0.15"
async-trait = "0.1"

# Fuzzy Matching & String Processing
strsim = "0.11"
fuzzy-matcher = "0.3"

# Prometheus metrics (text exposition for /metrics.prom)
prometheus = "0.13"

# Sibling matcher crate (canonical reference algorithm; reached via adapter)
person-matcher = "0.3.0"

# Security
argon2 = "0.5"
jsonwebtoken = "9.3"

[dev-dependencies]
# Testing
assertables = "9.8"
tokio-test = "0.4"
mockall = "0.13"
tempfile = "3.24"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[build-dependencies]
# gRPC code generation
tonic-build = "0.12"

[[bench]]
name = "matching_bench"
harness = false

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "validation_bench"
harness = false

[[bench]]
name = "bridge_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
