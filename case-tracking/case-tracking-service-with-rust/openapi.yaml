openapi: 3.1.0
info:
  title: Case Tracking API (Loco edition)
  version: 0.1.0
  description: >
    JSON API for tracking the physical location of paper case-note folders
    across NHS hospital cabinets. The tracker owns no domain tables; every
    entity is proxied from one of five upstream Main-X-Services. See
    `spec/index.md` for the full specification. This document is the
    machine-readable form of `spec/api-contract.md` + `spec/routes.md`.
servers:
  - url: http://localhost:5150
    description: Local dev (JSON API). In dev the SvelteKit app proxies /api here.
tags:
  - name: auth
  - name: folders
  - name: patients
  - name: places
  - name: workers
  - name: moves
  - name: volumes
  - name: alerts
  - name: stats

security:
  - sessionCookie: []
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [stats]
      summary: Liveness probe (no auth, never touches upstreams).
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /api/auth/request:
    post:
      tags: [auth]
      summary: Request a magic-link sign-in email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Always 200 (no email enumeration). `magic_link` is present only in dev/test.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
                  magic_link: { type: [string, 'null'] }
        '422': { $ref: '#/components/responses/Validation' }

  /api/auth/verify:
    post:
      tags: [auth]
      summary: Exchange a magic token for a session (sets the cts_session cookie).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Session established.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 'cts_session=<jwt>; HttpOnly; SameSite=Lax; Path=/'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserBody' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      tags: [auth]
      summary: The signed-in user.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserBody' }
          description: OK
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Clear the session cookie.
      responses:
        '204': { description: Logged out. }

  /api/stats:
    get:
      tags: [stats]
      summary: Aggregate counters. Soft-fails to zeros for any unreachable slice.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
          description: OK

  /api/folders:
    get:
      tags: [folders]
      summary: List/search folders.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: nhs_number, in: query, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderList' }
          description: OK
        '503': { $ref: '#/components/responses/Upstream' }
    post:
      tags: [folders]
      summary: Register a new folder (creates the patient upstream if needed).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFolder' }
      responses:
        '201':
          description: Created
          headers: { Location: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        '422': { $ref: '#/components/responses/Validation' }
        '503': { $ref: '#/components/responses/Upstream' }

  /api/folders/{id}:
    get:
      tags: [folders]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } }
          description: OK
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Upstream' }

  /api/folders/{id}/history:
    get:
      tags: [folders]
      summary: A folder's move history.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/MoveList' } } }
          description: OK
        '503': { $ref: '#/components/responses/Upstream' }

  /api/patients:
    get:
      tags: [patients]
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/PatientList' } } }
          description: OK
        '503': { $ref: '#/components/responses/Upstream' }

  /api/patients/{nhs}:
    get:
      tags: [patients]
      summary: Patient detail. Always 200 — falls back to folder snapshots when the Patient Service is down.
      parameters: [{ name: nhs, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/PatientShow' } } }
          description: OK

  /api/places:
    get:
      tags: [places]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [building, room, cabinet] } }
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/PlacesIndex' } } }
          description: OK
        '503': { $ref: '#/components/responses/Upstream' }
    post:
      tags: [places]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string }
                kind: { type: string, enum: [building, room, cabinet] }
                contained_in_place: { type: [string, 'null'], format: uuid }
                description: { type: [string, 'null'] }
                capacity: { type: [integer, 'null'] }
      responses:
        '201':
          description: Created
          headers: { Location: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } }
        '422': { $ref: '#/components/responses/Validation' }

  /api/places/{id}:
    get:
      tags: [places]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaceShow' } } }
          description: OK
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Upstream' }

  /api/places/{id}/history:
    get:
      tags: [places]
      summary: Folder presence history (cabinet intervals; room/building aggregate).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/PlaceHistory' } } }
          description: OK
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Upstream' }

  /api/workers:
    get:
      tags: [workers]
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkerList' } } }
          description: OK
        '503': { $ref: '#/components/responses/Upstream' }

  /api/workers/{id}:
    get:
      tags: [workers]
      summary: Worker detail — folders they moved + all their patients' folders.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkerShow' } } }
          description: OK
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Upstream' }

  /api/moves:
    get:
      tags: [moves]
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/MoveList' } } }
          description: OK
        '503': { $ref: '#/components/responses/Upstream' }
    post:
      tags: [moves]
      summary: Record a folder move.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMove' }
      responses:
        '201':
          description: Created
          headers: { Location: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Move' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '503': { $ref: '#/components/responses/Upstream' }

  /api/moves/{id}:
    get:
      tags: [moves]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/Move' } } }
          description: OK
        '404': { $ref: '#/components/responses/NotFound' }

  /api/volumes:
    get:
      tags: [volumes]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: nhs_number, in: query, schema: { type: string } }
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/VolumeList' } } }
          description: OK
        '503': { $ref: '#/components/responses/Upstream' }
    post:
      tags: [volumes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nhs_number, title]
              properties:
                nhs_number: { type: string }
                title: { type: string }
                cabinet_id: { type: [string, 'null'], format: uuid }
      responses:
        '201':
          description: Created
          headers: { Location: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Volume' } } }
        '422': { $ref: '#/components/responses/Validation' }
        '503': { $ref: '#/components/responses/Upstream' }

  /api/volumes/{id}:
    get:
      tags: [volumes]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/VolumeShow' } } }
          description: OK
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [volumes]
      summary: Rename a volume.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties: { title: { type: string } }
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/VolumeShow' } } }
          description: OK
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/volumes/{id}/folders:
    post:
      tags: [volumes]
      summary: Add a folder to the volume (same patient).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder_id]
              properties: { folder_id: { type: string, format: uuid } }
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/VolumeShow' } } }
          description: OK
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }

  /api/volumes/{id}/folders/{folder_id}:
    delete:
      tags: [volumes]
      summary: Remove a folder from the volume.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: folder_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/VolumeShow' } } }
          description: OK
        '404': { $ref: '#/components/responses/NotFound' }

  /api/volumes/{id}/move:
    post:
      tags: [volumes]
      summary: Move the whole volume — relocates every member folder, one move event each.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to_cabinet_id: { type: [string, 'null'], format: uuid }
                worker_id: { type: [string, 'null'], format: uuid }
                moved_by: { type: [string, 'null'] }
                reason: { type: [string, 'null'] }
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/VolumeShow' } } }
          description: OK
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '503': { $ref: '#/components/responses/Upstream' }

  /api/alerts:
    get:
      tags: [alerts]
      summary: Geofence alerts — moves that crossed a building boundary.
      responses:
        '200':
          content: { application/json: { schema: { $ref: '#/components/schemas/AlertList' } } }
          description: OK
        '503': { $ref: '#/components/responses/Upstream' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cts_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Authentication required.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Upstream:
      description: An upstream Main-X-Service is unreachable.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Validation:
      description: Validation failure — each failing field is keyed.
      content: { application/json: { schema: { $ref: '#/components/schemas/ValidationError' } } }
  schemas:
    Error:
      type: object
      properties: { error: { type: string } }
    ValidationError:
      type: object
      properties:
        errors:
          type: object
          additionalProperties: { type: string }
    UserBody:
      type: object
      properties:
        user:
          type: object
          properties:
            email: { type: string }
            name: { type: string }
            role: { type: [string, 'null'] }
    Stats:
      type: object
      properties:
        patients: { type: integer }
        folders:
          type: object
          properties:
            total: { type: integer }
            in_cabinet: { type: integer }
            in_transit: { type: integer }
        places:
          type: object
          properties:
            buildings: { type: integer }
            rooms: { type: integer }
            cabinets: { type: integer }
        moves_24h: { type: integer }
    Folder:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        patient_id: { type: string, format: uuid }
        nhs_number: { type: string }
        patient_name: { type: string }
        cabinet_id: { type: [string, 'null'], format: uuid }
        cabinet_label: { type: string }
        status: { type: string, enum: [in-cabinet, in-transit] }
        last_moved_at: { type: [string, 'null'], format: date-time }
        notes: { type: [string, 'null'] }
        volume_id: { type: [string, 'null'], format: uuid }
        volume_title: { type: [string, 'null'] }
    CreateFolder:
      type: object
      required: [nhs_number, title]
      properties:
        nhs_number: { type: string }
        patient_name: { type: [string, 'null'] }
        date_of_birth: { type: [string, 'null'], format: date }
        title: { type: string }
        cabinet_id: { type: [string, 'null'], format: uuid }
        notes: { type: [string, 'null'] }
        volume_id: { type: [string, 'null'], format: uuid }
    Patient:
      type: object
      properties:
        id: { type: string, format: uuid }
        nhs_number: { type: string }
        name: { type: string }
        date_of_birth: { type: [string, 'null'] }
        folder_count: { type: integer }
        source: { type: string }
    PatientShow:
      type: object
      properties:
        patient: { oneOf: [{ $ref: '#/components/schemas/Patient' }, { type: 'null' }] }
        folders: { type: array, items: { $ref: '#/components/schemas/Folder' } }
        history: { type: array, items: { $ref: '#/components/schemas/Move' } }
        nhs_number: { type: string }
        patient_service_match: { type: boolean }
    Place:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        place_type: { type: string }
        place_kind: { type: string, enum: [building, room, cabinet, other] }
        description: { type: [string, 'null'] }
        contained_in_place: { type: [string, 'null'], format: uuid }
        container_path: { type: string }
        capacity: { type: [integer, 'null'] }
        source: { type: string }
    Cabinet:
      allOf:
        - { $ref: '#/components/schemas/Place' }
        - type: object
          properties: { folder_count: { type: integer } }
    PlacesIndex:
      type: object
      properties:
        query: { type: [string, 'null'] }
        kind: { type: [string, 'null'] }
        buildings: { type: array, items: { $ref: '#/components/schemas/Place' } }
        rooms: { type: array, items: { $ref: '#/components/schemas/Place' } }
        cabinets: { type: array, items: { $ref: '#/components/schemas/Cabinet' } }
    PlaceShow:
      allOf:
        - { $ref: '#/components/schemas/Place' }
        - type: object
          properties: { folders: { type: array, items: { $ref: '#/components/schemas/Folder' } } }
    Presence:
      type: object
      properties:
        folder_id: { type: string, format: uuid }
        folder_title: { type: string }
        patient_id: { type: string, format: uuid }
        nhs_number: { type: string }
        patient_name: { type: string }
        cabinet_id: { type: string, format: uuid }
        cabinet_label: { type: string }
        entered_at: { type: string, format: date-time }
        left_at: { type: [string, 'null'], format: date-time }
        entered_reason: { type: [string, 'null'] }
        left_reason: { type: [string, 'null'] }
    PlaceHistory:
      allOf:
        - { $ref: '#/components/schemas/Place' }
        - type: object
          properties: { presences: { type: array, items: { $ref: '#/components/schemas/Presence' } } }
    Worker:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: [string, 'null'] }
    WorkerShow:
      type: object
      properties:
        worker: { $ref: '#/components/schemas/Worker' }
        moved_folders: { type: array, items: { $ref: '#/components/schemas/Folder' } }
        patient_folders: { type: array, items: { $ref: '#/components/schemas/Folder' } }
        moves: { type: array, items: { $ref: '#/components/schemas/Move' } }
    Move:
      type: object
      properties:
        id: { type: string, format: uuid }
        folder_id: { type: string, format: uuid }
        folder_title: { type: string }
        patient_id: { type: string, format: uuid }
        nhs_number: { type: string }
        patient_name: { type: string }
        from_cabinet_id: { type: [string, 'null'], format: uuid }
        from_cabinet_label: { type: string }
        to_cabinet_id: { type: [string, 'null'], format: uuid }
        to_cabinet_label: { type: string }
        worker_id: { type: [string, 'null'], format: uuid }
        moved_by: { type: string }
        worker_role: { type: [string, 'null'] }
        moved_at: { type: string, format: date-time }
        reason: { type: [string, 'null'] }
    CreateMove:
      type: object
      required: [folder_id]
      properties:
        folder_id: { type: string, format: uuid }
        to_cabinet_id: { type: [string, 'null'], format: uuid }
        worker_id: { type: [string, 'null'], format: uuid }
        moved_by: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
    Volume:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        patient_id: { type: string, format: uuid }
        nhs_number: { type: string }
        patient_name: { type: string }
        cabinet_id: { type: [string, 'null'], format: uuid }
        cabinet_label: { type: string }
        status: { type: string, enum: [in-cabinet, in-transit] }
        folder_count: { type: integer }
    VolumeShow:
      allOf:
        - { $ref: '#/components/schemas/Volume' }
        - type: object
          properties:
            folders: { type: array, items: { $ref: '#/components/schemas/Folder' } }
            history: { type: array, items: { $ref: '#/components/schemas/Move' } }
    Alert:
      type: object
      properties:
        move_id: { type: string, format: uuid }
        folder_id: { type: string, format: uuid }
        folder_title: { type: string }
        patient_name: { type: string }
        nhs_number: { type: string }
        from_building: { type: string }
        to_building: { type: string }
        from_cabinet_label: { type: string }
        to_cabinet_label: { type: string }
        moved_by: { type: string }
        moved_at: { type: string, format: date-time }
        reason: { type: [string, 'null'] }
    FolderList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Folder' } }
        query: { type: string }
    PatientList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Patient' } }
        query: { type: string }
    WorkerList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Worker' } }
        query: { type: string }
    MoveList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Move' } }
        query: { type: string }
    VolumeList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Volume' } }
        query: { type: string }
    AlertList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Alert' } }
