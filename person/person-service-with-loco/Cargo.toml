[package]
name = "person-service"
version = "0.6.0"
edition = "2024"
rust-version = "1.96"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Person Service - A person administration microservice that interoperates with the person-matcher crate"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/main-x-service/tree/main/person/person-service-with-loco"
keywords = ["person-matcher", "microservice"]
categories = ["database"]

[[bin]]
name = "person-service"
path = "src/bin/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.53", features = ["full"] }

# Web Framework & HTTP (axum 0.8 to match loco 0.16)
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }
csv = "1"

# Database (PostgreSQL ORM)
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-time", "with-uuid", "with-json", "with-bigdecimal"] }
bigdecimal = { version = "0.4", features = ["serde"] }

# Web Framework (Loco conventions; web/template tier removed)
# `auth` is deliberately absent from this feature list. It is loco's JWT
# support (`dep:jsonwebtoken`, and therefore `rsa` / RUSTSEC-2023-0071),
# and this family issues PASETO v4.public rather than JWT — see
# agents/share/jwt.md. Dropping it removes the vulnerable crate from the
# dependency graph rather than suppressing the advisory.
loco-rs = { version = "1.1.0", default-features = false, features = ["cli", "with-db", "cache_inmem", "worker"] }
migration = { path = "migration" }

# Search Engine
tantivy = "0.22"

# gRPC (PRO-H11: a real Tonic server, generated from proto/person.proto
# by build.rs; `prost` is the wire-message crate tonic-build's generated
# code names directly, so it is a normal dependency, not merely pulled
# in transitively through tonic's own "prost" feature)
tonic = { version = "0.12", features = ["transport", "codegen", "prost"] }
prost = "0.13"

# OpenAPI Documentation
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Data Streaming

# OpenTelemetry (Observability) — real OTLP export (PRO-H9), ported from
# link-graph-service's src/observability.rs, the family's first working
# exporter. Versions match it exactly (0.32 / 0.33), not this crate's
# former 0.27 / 0.28 pins: those were never exercised (the exporter they
# were added for was commented out), and 0.27's
# `install_batch(runtime::Tokio)` pipeline API no longer exists upstream.
#
# `grpc-tonic` (not the crate's default `http-proto` + blocking reqwest):
# the shared doc's `OTLP_ENDPOINT` default is `http://localhost:4317`, the
# gRPC port. `internal-logs` is kept ON so a failing export is visible in
# the log rather than silently dropped. No `logs` feature — link-graph's
# pipeline is traces + metrics only, and nothing here uses OTel logs.
opentelemetry = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "grpc-tonic",
  "trace",
  "metrics",
  "internal-logs",
] }
opentelemetry-semantic-conventions = { version = "0.32" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "0.33" }

# Utilities
uuid = { version = "1.26", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
thiserror = "2.0"
dotenvy = "0.15"
async-trait = "0.1"

# Fuzzy Matching & String Processing
strsim = "0.11"

# Prometheus metrics (text exposition for /metrics.prom)
prometheus = "0.13"
# SHA-256 for the tamper-evident audit hash chain (HIPAA §164.312(c)).
# See src/compliance/audit_chain.rs.
sha2 = "0.10"
# Second integrity digest. SHA-3 (FIPS 202) is a **sponge** construction,
# structurally unrelated to SHA-256's Merkle-Damgard chaining, so a
# cryptanalytic advance against one design family does not transfer to
# it. See spec/12-compliance.md §12.4z.
sha3 = "0.10"
# Keyed integrity (HMAC-SHA256, FIPS 198-1) over the same pre-image, with
# a key the database never holds — see spec/12-compliance.md §12.4z. The
# unkeyed digests are forgeable by anyone who can write SQL, since their
# format is published; this is what raises the bar above that.
# Keyed integrity MACs with production-grade key handling — one audited
# implementation shared by every service, rather than a copy per crate.
integrity-mac = { path = "../../integrity/integrity-mac-rust-crate" }
# HKDF-SHA256 (RFC 5869) derives a per-(service, domain) subkey from the
# configured MAC root key, so a tag cannot transfer between purposes, or
# between two services sharing one cluster-wide key. See
# src/compliance/mac.rs and spec/12-compliance.md §12.4z.
# Wipes the root key from memory once the domain subkeys are derived, so
# it does not survive in core dumps or swap.
# OS entropy for the integrity_key task.

# Sibling matcher crate (canonical reference algorithm; reached via adapter)
person-matcher = { version = "0.6.1", path = "../person-matcher-rust-crate" }

# Shared cross-service-linking contract: the EntityRef URN value type and
# the §9 EdgeKind registry (agents/share/cross-service-linking.md §3, §9).
# Used by the entity-links write side to parse/validate `to_ref` and the
# `kind`/endpoint pair (`same_identity` person → worker).
entity-ref = { path = "../../link/entity-ref-rust-crate" }

# Security
# Offline PASETO v4.public verification of authentication-service tokens
# against its published Ed25519 key set (`/.well-known/paseto-keys`) — no
# shared secret, no per-request introspection hop (local path — the
# monorepo's 0.2 PASETO verifier). The `fetch` feature adds
# `Verifier::from_paseto_keys_url` (reqwest/rustls) for the boot-time
# key-set fetch behind `PERSON_PASETO_KEYS_URL` (spec §13 T-1c).
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", features = ["fetch"] }
mimalloc = "0.1.52"

# Durable event bus Phase 3 (BUS-3; agents/share/event-bus.md §5/§8,
# following case-service's BUS-1 reference): the relay's real broker
# sink. Optional and behind the `fluvio` feature below so the default
# dependency tree (and every existing deployment's build) is unchanged —
# the relay's `LoggingSink` covers dev/CI with no broker at all.
fluvio = { version = "0.50", optional = true }

# Parquet export (BLK-3, feature-gated — agents/share/bulk-import-export.md
# §5/§11/§12: "Heavier dependency (arrow/parquet), feature-gated and
# export-first in v1"). Both optional and pulled in only by the `parquet`
# feature below, so the default dependency tree (and every existing
# deployment's build) is unchanged. `arrow` builds the in-memory
# RecordBatch; `parquet`'s own `arrow` feature is the writer/reader that
# serializes one to/from Parquet bytes — same crates.io release line
# (59.1.0) since the two are versioned in lockstep upstream.
arrow = { version = "59.2.0", default-features = false, optional = true }
parquet = { version = "59.2.0", default-features = false, features = ["arrow"], optional = true }

# S3-compatible artifact storage for bulk jobs (BLK-4, optional —
# agents/share/bulk-import-export.md §12: care-pathway is the reference
# implementation, ported here). The maintained AWS SDK rather than
# hand-rolled SigV4 signing: signing is security-relevant code, and there
# is no way to verify a hand-rolled implementation in this repository's
# test environment without a live endpoint. Optional so the default
# dependency tree — and the default build time — is unchanged for
# deployments using the local backend.
aws-config = { version = "1", optional = true, default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "rustls",
] }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "rustls",
  "sigv4a",
] }
aws-credential-types = { version = "1", optional = true }

[features]
# Off by default. `dep:` syntax so this is the *only* way to reach either
# crate — plain `--features arrow` or `--features parquet` (the implicit
# per-optional-dep features Cargo would otherwise synthesize) are
# suppressed, so there is exactly one on/off switch to document and test.
parquet = ["dep:parquet", "dep:arrow"]
# S3-compatible artifact storage. Off by default: the local-filesystem
# backend covers dev and test, and the SDK is a large dependency tree no
# deployment should pay for unless it uses it.
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-credential-types"]
# Off by default. The relay's `EventSink` seam (src/relay.rs) needs no
# feature to build or test; only `FluvioSink` — the real-broker producer
# — lives behind this.
fluvio = ["dep:fluvio"]

[dev-dependencies]
# Serialises the DB-gated audit-chain tests: they each truncate
# `audit_log`, so running them concurrently would have one test wipe
# another's chain mid-append.
serial_test = "3.5"
# Testing
assertables = "10"
tokio-test = "0.4"
mockall = "0.13"
tempfile = "3.27"
proptest = "1.11"

# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the bearer-verification path is exercised without the auth service or
# any network dependency.
ed25519-dalek = { version = "2.2" }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
base64 = { version = "0.23" }

# Benchmarking
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

# `parquet::file::reader::ChunkReader` is implemented for `bytes::Bytes`
# (and `File`), not `std::io::Cursor` — needed to read encoded Parquet
# bytes back in `src/bulk/parquet_format.rs`'s round-trip tests.
bytes = "1.12.1"

# An in-process OTLP/gRPC collector for `tests/otlp_export.rs` /
# `tests/otlp_middleware.rs` (PRO-H9, ported from link-graph-service): the
# generated `TraceServiceServer` / `MetricsServiceServer` plus tonic's
# server transport, so the export pipeline is proved against a real gRPC
# listener in a normal `cargo test` run — no external collector, nothing
# `#[ignore]`d. This `tonic` (0.14, from opentelemetry-otlp's own
# `grpc-tonic` line) is deliberately a different major version from this
# crate's main `tonic = "0.12"` (the gRPC stub, `src/api/grpc/`) — Cargo
# links both without conflict since they are separate crates to the
# compiler; there is no version to unify.
opentelemetry-proto = { version = "0.32", default-features = false, features = [
  "gen-tonic",
  "trace",
  "metrics",
] }
# Renamed (`package = "tonic"`), not a plain `tonic = "0.14"` dev-dependency:
# this crate's *main* dependencies already include `tonic = "0.12"` (the
# gRPC stub, `src/api/grpc/`), and a regular dependency plus a dev-dependency
# sharing the unrenamed name `tonic` at two different versions makes rustc
# refuse the test binary with `E0464: multiple candidates for rlib
# dependency tonic` — both register into the same extern prelude with no
# way to disambiguate `use tonic::...`. link-graph-service has no such
# collision (it carries no gRPC stub of its own), so this rename has no
# analogue there; it is genuinely new to this port. The renamed crate is
# still exactly `tonic` 0.14.6 underneath — the same build
# `opentelemetry-proto`'s own `tonic` 0.14 dependency resolves to — so
# `otlp_test_tonic::Response<T>` and the generated
# `opentelemetry_proto::tonic::...` types are the same types; only the
# `use` path in the test files changes.
otlp-test-tonic = { package = "tonic", version = "0.14" }
tokio-stream = { version = "0.1", features = ["net"] }
# The mounted-middleware test (`tests/otlp_middleware.rs`) makes a real
# HTTP request against a served router; this crate has no other direct
# `reqwest` dependency (only a transitive one via
# `authentication-verifier`'s `fetch` feature).
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

[build-dependencies]
# gRPC code generation (PRO-H11). Pinned to 0.12 to match the main
# `tonic = "0.12"` dependency above — codegen and runtime must be the
# same tonic major line, or the generated server trait's associated
# types don't match what this crate's `tonic::transport::Server`
# expects. This was previously pinned at 0.14 with no `build.rs` and no
# `proto/` directory at all (dead scaffolding, same trap
# `agents/share/observability.md` documents for the OTLP dependency
# generations in place/thing's manifests) — not simply reused as-is.
tonic-build = "0.12"

[[bench]]
name = "matching_bench"
harness = false

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "validation_bench"
harness = false

[[bench]]
name = "bridge_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
