# Spec-drift CI check (spec/13-tasks.md T-7).
#
# Fails a pull request that modifies a watched source file
# (src/matching/**, src/models/person.rs) without also updating spec/,
# unless the changed paths match an allowlist pattern in `.spec-allow`.
#
# Rationale: this crate practises spec-driven development — spec/ is
# the single source of truth. Behaviour changes that land in code
# without a matching spec update silently break the discipline.
#
# Note: like this crate's other `.github/workflows/*.yml` files, this
# workflow is nested under a subcrate directory rather than the
# repository root, so GitHub Actions does not discover or run it in
# this monorepo (the root `.github/workflows/ci.yml` is what actually
# runs). It documents the intended CI wiring and is directly runnable
# with `bash scripts/spec-drift-check.sh main HEAD` from a contributor
# machine or a future root-CI integration.

name: spec-drift

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: spec vs code
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (full history needed for diff vs base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run spec-drift check
        run: bash scripts/spec-drift-check.sh "${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
