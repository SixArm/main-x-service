logger:
  enable: false
  pretty_backtrace: true
  level: error
  format: compact

server:
  port: 5151
  binding: 0.0.0.0
  host: http://localhost

workers:
  mode: ForegroundBlocking

database:
  uri: {{ get_env(name="DATABASE_URL", default="postgres://localhost/person_service_test") }}
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 5
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: false

auth:
  jwt:
    secret: "test-only-secret"
    expiration: 604800
