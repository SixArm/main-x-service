[package]
name = "worker-matcher"
version = "0.7.1"
edition = "2024"
rust-version = "1.98"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Worker matcher for healthcare information exchange: deterministic and probabilistic matching with multinational national identifiers (UK NHS / FR NIR / ES TSI / IE IHI / UK NI H&C / US SSN), E.164 phone normalisation, address parsing, nickname dictionary, email scoring, and explainable per-field breakdowns."
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"
repository = "https://github.com/sixarm/worker-matcher-rust-crate"
readme = "README.md"
keywords = ["worker", "matching", "healthcare", "identity", "fhir"]
categories = ["science", "data-structures", "value-formatting"]
include = ["src/**/*", "LICENSE.md", "README.md", "CHANGELOG.md"]

[[bin]]
name = "worker-matcher"
path = "src/main.rs"
# No unit tests live here; tests/demo.rs runs the binary instead.
test = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }
unicode-normalization = "0.1"
strsim = "0.11"
thiserror = "2.0"
soundex = "0.2"
nhs-number = "2.0"
mimalloc = "0.1.52"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.12"

[[bench]]
name = "match_pair"
harness = false

# Faster dev builds: line tables are enough for backtraces and panics, and
# dependencies carry no debug info at all.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
# Without this, cargo strips debug info from proc-macro dylibs (sqlx-macros),
# and macOS then refuses to load them.
strip = "none"

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
