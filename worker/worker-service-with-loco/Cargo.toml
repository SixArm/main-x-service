[package]
name = "worker-service"
version = "0.5.0"
edition = "2024"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Worker Service - A worker administration microservice that interoperates with the worker-matcher crate"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/main-x-service/worker-service-with-loco"
keywords = ["worker-matcher", "microservice"]
categories = ["database"]

[[bin]]
name = "worker-service"
path = "src/bin/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.53", features = ["full"] }

# Web Framework & HTTP (axum 0.8 to match loco 0.16)
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
hyper = { version = "1.11", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database (PostgreSQL ORM)
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-time", "with-uuid", "with-json"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
bigdecimal = { version = "0.4", features = ["serde"] }

# Web Framework (Loco conventions; web/template tier removed)
loco-rs = { version = "0.16.4", default-features = false, features = ["auth_jwt", "cli", "with-db", "cache_inmem", "bg_pg"] }
migration = { path = "migration" }

# Search Engine
tantivy = "0.22"

# gRPC
tonic = { version = "0.12", features = ["transport", "codegen", "prost"] }
prost = "0.13"

# OpenAPI Documentation
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
openapiv3 = "2.2"

# Data Streaming
fluvio = "0.23"

# OpenTelemetry (Observability)
opentelemetry = { version = "0.27", features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.27", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace", "metrics", "logs"] }
opentelemetry-semantic-conventions = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"

# Utilities
uuid = { version = "1.24", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
thiserror = "2.0"
anyhow = "1.0"
validator = { version = "0.19", features = ["derive"] }
dotenvy = "0.15"
async-trait = "0.1"

# Fuzzy Matching & String Processing
strsim = "0.11"
fuzzy-matcher = "0.3"

# Prometheus metrics (text exposition for /metrics.prom)
prometheus = "0.13"

# Sibling matcher crate
worker-matcher = { version = "0.6.1", path = "../worker-matcher-rust-crate" }

# Security
argon2 = "0.5"
# Offline PASETO v4.public verification of authentication-service tokens
# against its published Ed25519 key set (`/.well-known/paseto-keys`) — no
# shared secret, no per-request introspection hop (local path — the
# monorepo's 0.2 PASETO verifier). The `fetch` feature adds
# `Verifier::from_paseto_keys_url` (reqwest/rustls) for the boot-time
# key-set fetch behind `WORKER_PASETO_KEYS_URL` (spec §13 T-1b).
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", features = ["fetch"] }
# Shared cross-service `EntityRef` value type + the §9 EdgeKind registry
# (agents/share/cross-service-linking.md §3, §9). Used by the entity-links
# write side to parse/validate `to_ref` and the `kind`/endpoint pair
# (`same_identity` worker → person).
entity-ref = { path = "../../link/entity-ref-rust-crate" }
mimalloc = "0.1.52"

# SHA-256 for the tamper-evident audit hash chain (HIPAA §164.312(c)).
# See src/compliance/audit_chain.rs.
sha2 = "0.10"
# Second integrity digest alongside SHA-256 — see spec/12-compliance.md
# §12.4z. Not a replacement: SHA-256 stays as the conservative,
# FIPS-approved digest, and BLAKE3 adds speed and algorithm agility.
blake3 = "1"
# Third integrity digest. SHA-3 (FIPS 202) is a **sponge** construction,
# structurally unrelated to SHA-256's Merkle-Damgard and to BLAKE3's ARX
# tree, so a cryptanalytic advance against one design family does not
# transfer. See spec/12-compliance.md §12.4z.
sha3 = "0.10"

[dev-dependencies]
# Serialises the DB-gated audit-chain tests: they each truncate
# `audit_log`, so running them concurrently would have one test wipe
# another's chain mid-append.
serial_test = "3.5"
# Testing
assertables = "10"
tokio-test = "0.4"
mockall = "0.13"
tempfile = "3.27"

# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the bearer-verification path is exercised without the auth service or
# any network dependency.
ed25519-dalek = { version = "2.2" }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
base64 = { version = "0.22" }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[build-dependencies]
# gRPC code generation
tonic-build = "0.12"

[[bench]]
name = "matching_bench"
harness = false

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "validation_bench"
harness = false


[[bench]]
name = "bridge_bench"
harness = false
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
