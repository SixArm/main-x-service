[package]
name = "worker-service"
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Worker Service - A worker administration microservice that interoperates with the worker-matcher crate"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/main-x-service/tree/main/worker/worker-service-with-axum"
keywords = ["worker-matcher", "microservice"]
categories = ["database"]

[[bin]]
name = "worker-service"
path = "src/bin/main.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.54", features = ["full"] }

# Web Framework & HTTP (axum 0.8, matching axa)
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
tower = { version = "0.5", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }

# Database: sqlx directly, no ORM. Every statement is a `query!` /
# `query_as!` / `query_scalar!` literal in `src/db/`, checked at compile
# time against the committed `.sqlx/` data (spec/tech-stack §5). The same
# driver axa's `sqlx` feature already pulls in, so this adds no new
# database stack. Timestamps map to `chrono`, which the domain models
# already use: with sqlx's `time` feature on as well, sqlx 0.9.0's macros
# warn on every timestamp column.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "uuid", "chrono", "json"] }

axa = { version = "0.8", features = ["sqlx", "openapi", "opentelemetry", "versioning", "ratelimit"] }

# Search Engine
tantivy = "0.27"

# gRPC. tonic 0.14 split the prost codec out of the core crate into
# `tonic-prost` (runtime) + `tonic-prost-build` (codegen, see the
# build-dependency below) — there is no "prost" feature on `tonic`
# itself any more, and the generated server/client code names
# `tonic_prost::ProstCodec` directly, so `tonic-prost` is a normal
# dependency, not merely pulled in transitively.
tonic = { version = "0.14", features = ["transport", "codegen"] }
tonic-prost = "0.14"
prost = "0.14"

# OpenAPI Documentation
utoipa = { version = "6.0", features = ["axum_extras", "chrono", "uuid"] }

# Data Streaming

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1.29", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# The audit trail, the outbox, the entity links, the review queue and the
# assessments keep `time` types at the edges of the database layer.
# `serde` keeps the timestamps of rows serialized on the wire in the form
# they had, which SeaORM had been enabling for this crate.
time = { version = "0.3", features = ["serde"] }
thiserror = "2.0"
dotenvy = "0.15"
async-trait = "0.1"

# Fuzzy Matching & String Processing
strsim = "0.11"

# Prometheus metrics (text exposition for /metrics.prom)
prometheus = "0.14"

# Sibling matcher crate
worker-matcher = { version = "0.7.0", path = "../worker-matcher-rust-crate" }

# Security
# Offline PASETO v4.public verification of authentication-service tokens
# against its published Ed25519 key set (`/.well-known/paseto-keys`) — no
# shared secret, no per-request introspection hop (local path — the
# monorepo's 0.2 PASETO verifier). The `fetch` feature adds
# `Verifier::from_paseto_keys_url` (reqwest/rustls) for the boot-time
# key-set fetch behind `WORKER_PASETO_KEYS_URL` (spec §13 T-1b).
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", default-features = false }
# Shared cross-service `EntityRef` value type + the §9 EdgeKind registry
# (agents/share/cross-service-linking.md §3, §9). Used by the entity-links
# write side to parse/validate `to_ref` and the `kind`/endpoint pair
# (`same_identity` worker → person).
entity-ref = { path = "../../link/entity-ref-rust-crate" }
mimalloc = "0.1.52"

# SHA-256 for the tamper-evident audit hash chain (HIPAA §164.312(c)).
# See src/compliance/audit_chain.rs.
sha2 = "0.11"
# Second integrity digest. SHA-3 (FIPS 202) is a **sponge** construction,
# structurally unrelated to SHA-256's Merkle-Damgard chaining, so a
# cryptanalytic advance against one design family does not transfer to
# it. See spec/12-compliance.md §12.4z.
sha3 = "0.12"
# Keyed integrity (HMAC-SHA256, FIPS 198-1) over the same pre-image, with
# a key the database never holds — see spec/12-compliance.md §12.4z. The
# unkeyed digests are forgeable by anyone who can write SQL, since their
# format is published; this is what raises the bar above that.
# Keyed integrity MACs with production-grade key handling — one audited
# implementation shared by every service, rather than a copy per crate.
integrity-mac = { path = "../../integrity/integrity-mac-rust-crate" }
# HKDF-SHA256 (RFC 5869) derives a per-(service, domain) subkey from the
# configured MAC root key, so a tag cannot transfer between purposes, or
# between two services sharing one cluster-wide key. See
# src/compliance/mac.rs and spec/12-compliance.md §12.4z.
# Wipes the root key from memory once the domain subkeys are derived, so
# it does not survive in core dumps or swap.
# OS entropy for the integrity_key task.

# Durable event bus Phase 3 (BUS-3, ported from the case-service BUS-1
# reference; agents/share/event-bus.md §5/§8): the relay's real broker
# sink. Optional and behind the `fluvio` feature below so the default
# dependency tree (and every existing deployment's build) is unchanged —
# the relay's `LoggingSink` covers dev/CI with no broker at all.
fluvio = { version = "0.50", optional = true }

[features]
# PASETO bearer verification (the family default): `Verifier`, the boot key
# fetch and the rotation refresh. Turn it off (`--no-default-features`) for a
# deployment whose only bearer credential is a Keycloak access token.
default = ["paseto"]
paseto = ["authentication-verifier/paseto", "authentication-verifier/fetch"]
# Also accept Keycloak (OIDC) access tokens, configured by
# `WORKER_KEYCLOAK_*` (see src/api/rest/auth.rs). Off by default.
keycloak = ["authentication-verifier/keycloak"]
# Off by default. The relay's `EventSink` seam (src/relay.rs) needs no
# feature to build or test; only `FluvioSink` — the real-broker producer
# — lives behind this.
fluvio = ["dep:fluvio"]

[dev-dependencies]
axa = { version = "0.8", features = ["sqlx", "testing", "openapi", "opentelemetry", "versioning", "ratelimit"] }
# A local OIDC provider so tests/keycloak_guard.rs can push a Keycloak access
# token through the real guard without a Keycloak container. Tests only.
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", default-features = false, features = ["test-idp"] }
# Serialises the DB-gated audit-chain tests: they each truncate
# `audit_log`, so running them concurrently would have one test wipe
# another's chain mid-append.
serial_test = "4.0.1"
# Testing
assertables = "10"
tokio-test = "0.4"
mockall = "0.15"
tempfile = "3.27"

# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the bearer-verification path is exercised without the auth service or
# any network dependency.
ed25519-dalek = { version = "3.0" }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
base64 = { version = "0.23" }

# An in-process OTLP/gRPC collector for `tests/otlp_export.rs`: the
# generated `TraceServiceServer` / `MetricsServiceServer` plus tonic's
# server transport, so the service's OTLP wiring is proved against a real
# gRPC listener in a normal `cargo test` run — no external collector,
# nothing `#[ignore]`d.
opentelemetry-proto = { version = "0.33", default-features = false, features = [
  "gen-tonic",
  "trace",
  "metrics",
] }
# Plain `tonic`, no rename needed: this crate's main `tonic` dependency
# above is now also 0.14 (the tonic-prost split, see its own comment),
# so there is no longer a version collision to dodge with an
# `otlp-test-tonic = { package = "tonic", … }` alias — that rename was
# only ever needed while the main gRPC stub sat on tonic 0.12 and this
# dev-dependency on 0.14 at once.
tokio-stream = { version = "0.1", features = ["net"] }
# `tests/otlp_export.rs` makes a real HTTP request against a served
# router; this crate has no other direct
# `reqwest` dependency (only a transitive one via
# `authentication-verifier`'s `fetch` feature).
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }

# Benchmarking
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

[build-dependencies]
# gRPC code generation (PRO-H11). tonic 0.14 moved prost codegen out of
# `tonic-build` into `tonic-prost-build` (see the main `tonic-prost`
# dependency's comment) — pinned to the same 0.14 line as the main
# `tonic` dependency above, since codegen and runtime must be the same
# tonic major line.
tonic-prost-build = "0.14"
# `tonic_prost_build::compile_protos` shells out to a real `protoc` binary —
# it does not bundle one. CI's runner has no `protoc` installed, so a
# plain `compile_protos` call fails there ("Could not find `protoc`")
# while succeeding locally on any machine that already has `protoc` on
# `PATH` (found on person-service first; ported the fix here in the
# same pass rather than let this crate hit the identical CI failure).
# `protoc-bin-vendored` ships prebuilt `protoc` binaries for the
# platforms this family builds on; `build.rs` points `PROTOC` at it
# before compiling.
protoc-bin-vendored = "3"

[[bench]]
name = "matching_bench"
harness = false

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "validation_bench"
harness = false


[[bench]]
name = "bridge_bench"
harness = false
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Proc macros and build scripts are not stripped. With `strip = true`
# reaching them, macOS refuses to load the stripped `sqlx-macros` dylib
# that `query!` runs in, and a release build fails. The shipped binary is
# still stripped; only host-side build tools are not.
[profile.release.build-override]
strip = false

[profile.bench]
inherits = "release"
