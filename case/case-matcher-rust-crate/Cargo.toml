[package]
name = "case-matcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Case matcher — pairwise governmental case-management record matching with weighted fuzzy + deterministic strategies"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/main-x-service/tree/main/case/case-matcher-rust-crate"
keywords = ["case", "case-management", "matching", "identity"]
categories = ["algorithms", "text-processing"]

[lib]
name = "case_matcher"
path = "src/lib.rs"

[[bin]]
name = "case-matcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }
strsim = "0.11"
unicode-normalization = "0.1"
thiserror = "2.0"
mimalloc = "0.1.52"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bench]]
name = "match_pair"
harness = false
