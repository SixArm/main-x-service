[package]
name = "integrity-mac"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Keyed integrity MACs (HMAC-SHA256) with HKDF domain separation and production-grade key handling for the Main X Index family"
readme = "README.md"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"
repository = "https://github.com/sixarm/main-x-service/tree/main/integrity/integrity-mac-rust-crate"
keywords = ["integrity", "hmac", "hkdf", "tamper-evidence", "audit"]
categories = ["cryptography"]

[lib]
name = "integrity_mac"
path = "src/lib.rs"

[dependencies]
# HMAC-SHA256 (FIPS 198-1) — the keyed digest itself.
hmac = "0.13"
sha2 = "0.11"
# HKDF-SHA256 (RFC 5869) — per-(service, domain) subkey derivation.
hkdf = "0.13"
# Wipes the root key once the subkeys are derived.
zeroize = "1"
# OS entropy for key generation.
getrandom = "0.4"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "mac"
harness = false

# Faster dev builds: line tables are enough for backtraces and panics, and
# dependencies carry no debug info at all.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
# Without this, cargo strips debug info from proc-macro dylibs (sqlx-macros),
# and macOS then refuses to load them.
strip = "none"

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
