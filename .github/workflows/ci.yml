name: CI

# The repository has no root `Cargo.toml` — each crate is its own
# workspace — so nothing here can use `--workspace` to cover the tree.
# `scripts/ci-crates.sh` discovers the crates and feeds a job matrix, and
# every step shells out to `scripts/ci-check.sh` so this pipeline and the
# Woodpecker one run byte-identical commands. A check that only fails on
# one platform is a check nobody trusts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Cut link time and disk use; nothing here needs a debugger.
  CARGO_PROFILE_TEST_DEBUG: 0
  # Incremental state is pure disk cost here: every job is a from-scratch
  # checkout, so there is never a prior compilation to incrementally build
  # on, only megabytes of state nobody reads. Standard CI advice, not
  # specific to this repo.
  CARGO_INCREMENTAL: 0

jobs:
  discover:
    name: discover crates
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.list.outputs.crates }}
      db-crates: ${{ steps.list.outputs.db-crates }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "crates=$(scripts/ci-crates.sh --json)" >> "$GITHUB_OUTPUT"
          # Crates enrolled for database-backed suites (see ci/db-suites.txt).
          db=$(grep -v '^[[:space:]]*#' ci/db-suites.txt \
               | grep -v '^[[:space:]]*$' \
               | paste -sd, - \
               | sed 's/[^,]*/"&"/g')
          echo "db-crates=[$db]" >> "$GITHUB_OUTPUT"

  # Formatting is cheap and needs no build, so it runs once over every
  # crate rather than paying matrix setup 55 times.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: scripts/ci-check.sh fmt

  # Repo-wide convention checks. No build, no matrix — it reads the git
  # index, which is the only layer that tells the truth about path case
  # on a contributor's case-insensitive filesystem.
  docs:
    name: docs conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-check.sh docs

  check:
    name: ${{ matrix.crate }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # Report every failing crate in one run rather than stopping at the
      # first — with 55 independent crates, fail-fast hides more than it
      # saves.
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.discover.outputs.crates) }}
    steps:
      - uses: actions/checkout@v4
      - name: free disk space (drop preinstalled runner bloat this repo never touches)
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-}" \
            2>/dev/null || true
          echo "after:"; df -h /
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
          key: ${{ matrix.crate }}
      - name: clippy (pedantic, warnings are errors)
        run: scripts/ci-check.sh clippy '${{ matrix.crate }}'
      - name: test
        run: scripts/ci-check.sh test '${{ matrix.crate }}'
      # Compile-only. Criterion numbers from a shared CI runner are not
      # worth trusting, but a benchmark that stopped compiling is worth
      # finding here rather than the next time someone wants a number.
      - name: bench (compile only)
        run: scripts/ci-check.sh bench '${{ matrix.crate }}'
      # Runs after every check above, not between them: the cache-save
      # step below is a `post:` hook that Swatinem/rust-cache registers
      # automatically and fires after this job's last explicit step, so
      # cleaning here — rather than after just clippy or just test — is
      # what actually gives the archive step headroom, at the cost of the
      # crate's own build output not surviving into next run's cache
      # (external dependency artifacts, the part worth reusing, live under
      # `~/.cargo` and are unaffected).
      - name: clean this crate's target/ (headroom for the cache-save step)
        if: always()
        run: rm -rf '${{ matrix.crate }}/target'

  # Minimum Supported Rust Version — the current stable minus three
  # (spec/rust-msrv-n-minus-3.md). Its own job rather than a step inside
  # `check`: it is a second full compile of every crate under a different
  # toolchain, so it wants its own cache key instead of thrashing the
  # stable one. The stage checks manifest consistency against ci/msrv.txt
  # first, so a crate that simply forgot `rust-version` fails in seconds
  # rather than after a build.
  msrv:
    name: msrv · ${{ matrix.crate }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.discover.outputs.crates) }}
    steps:
      - uses: actions/checkout@v4
      - name: free disk space (drop preinstalled runner bloat this repo never touches)
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-}" \
            2>/dev/null || true
          echo "after:"; df -h /
      - name: install the MSRV toolchain
        run: |
          msrv=$(grep -v '^[[:space:]]*#' ci/msrv.txt \
                 | grep -v '^[[:space:]]*$' | head -1 | tr -d '[:space:]')
          echo "installing Rust $msrv (from ci/msrv.txt)"
          rustup toolchain install "$msrv" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
          key: msrv-${{ matrix.crate }}
      - run: scripts/ci-check.sh msrv '${{ matrix.crate }}'
      # See the `check` job's identical step for why this runs last, once,
      # rather than between steps.
      - name: clean this crate's target/ (headroom for the cache-save step)
        if: always()
        run: rm -rf '${{ matrix.crate }}/target'

  # The `#[ignore]`-gated suites. These are where the compliance controls
  # are actually proven — no unit test can show that an audit digest
  # survives a Postgres JSONB round-trip, or that a raw-SQL row edit is
  # detected — so CI runs them against a real database.
  test-db:
    name: db · ${{ matrix.crate }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJson(needs.discover.outputs.db-crates) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
    steps:
      - uses: actions/checkout@v4
      - name: free disk space (drop preinstalled runner bloat this repo never touches)
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-}" \
            2>/dev/null || true
          echo "after:"; df -h /
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
          key: db-${{ matrix.crate }}
      - run: scripts/ci-check.sh test-db '${{ matrix.crate }}'
      # See the `check` job's identical step for why this runs last, once,
      # rather than between steps.
      - name: clean this crate's target/ (headroom for the cache-save step)
        if: always()
        run: rm -rf '${{ matrix.crate }}/target'

  # IEC 62304 / FD&C §524B supply-chain evidence. The SOUP-annotation gate
  # and the requirement->test traceability check are ordinary tests, so
  # `check` already enforces them; this job adds advisory/licence scanning
  # and publishes the rendered SBOM as an artefact.
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: free disk space (drop preinstalled runner bloat this repo never touches)
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-}" \
            2>/dev/null || true
          echo "after:"; df -h /
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo-deny (advisories + licences)
        run: scripts/ci-check.sh deny
      - name: render SBOM
        run: |
          cd care-pathway/care-pathway-service-with-loco
          cargo run --locked --quiet --bin sbom > "$RUNNER_TEMP/sbom.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: care-pathway-sbom
          path: ${{ runner.temp }}/sbom.cdx.json
      # The SBOM is already written to $RUNNER_TEMP above, outside target/,
      # so this can run after — headroom for the cache-save step.
      - name: clean care-pathway's target/ (headroom for the cache-save step)
        if: always()
        run: rm -rf care-pathway/care-pathway-service-with-loco/target
