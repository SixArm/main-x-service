[package]
name = "course-service"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Course Service — a course-administration microservice modelled on schema.org/Course; interoperates with the course-matcher crate"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/main-x-service/tree/main/course/course-service-with-loco"
keywords = ["course-matcher", "education", "microservice"]
categories = ["database"]

[lib]
name = "course_service"
path = "src/lib.rs"

[[bin]]
name = "course-service"
path = "src/bin/main.rs"

[dependencies]
# Keyed integrity MACs with production-grade key handling — one audited
# implementation shared by every service, rather than a copy per crate.
integrity-mac = { path = "../../integrity/integrity-mac-rust-crate" }
# Unkeyed content digests, kept for structural diversity.
sha2 = { version = "0.10" }
sha3 = { version = "0.10" }
# Async runtime
tokio = { version = "1.53", features = ["full"] }

# Loco framework (backend-only; the service boots through loco's
# Hooks/AppContext/CLI and mounts its REST router via after_routes).
# `auth` is deliberately absent from this feature list. It is loco's JWT
# support (`dep:jsonwebtoken`, and therefore `rsa` / RUSTSEC-2023-0071),
# and this family issues PASETO v4.public rather than JWT — see
# agents/share/jwt.md. Dropping it removes the vulnerable crate from the
# dependency graph rather than suppressing the advisory.
loco-rs = { version = "1.1.0", default-features = false, features = ["cli", "with-db", "cache_inmem", "worker"] }
migration = { path = "migration" }

# Web framework (axum 0.8 to match loco 0.16)
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }

# Database
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-time", "with-uuid", "with-json"] }

# Search
tantivy = "0.22"

# OpenAPI documentation
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Common types
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
uuid = { version = "1.24", features = ["serde", "v4"] }

# Observability
prometheus = { version = "0.13" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Real OpenTelemetry OTLP export (PRO-H12, ported from person-service —
# see src/observability.rs's module docs). `grpc-tonic` (not the crate's
# default `http-proto` + blocking reqwest): the shared doc's
# `OTLP_ENDPOINT` default is `http://localhost:4317`, the gRPC port.
# `internal-logs` is kept ON so a failing export is visible in the log
# rather than silently dropped. No `logs` feature — this pipeline is
# traces + metrics only.
opentelemetry = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "grpc-tonic",
  "trace",
  "metrics",
  "internal-logs",
] }
opentelemetry-semantic-conventions = { version = "0.32" }
tracing-opentelemetry = { version = "0.33" }

# Error handling
thiserror = "2.0"

# Env / config
dotenvy = "0.15"

# Sibling matcher crate (embedded via re-export so the service uses the
# canonical algorithm rather than maintaining a fork). `path` makes
# local matcher changes reach this service without a crates.io publish
# round-trip first; `version` is kept alongside for crates.io publish
# parity (mirrors worker-service-with-loco's `worker-matcher` dependency).
course-matcher = { version = "0.7.0", path = "../course-matcher-rust-crate" }

# `dyn CourseRepository` needs object-safe async via async_trait.
async-trait = "0.1"
mimalloc = "0.1.52"

# Offline PASETO v4.public verification of authentication-service tokens
# against its published Ed25519 key set (`/.well-known/paseto-keys`) — no
# shared secret, no per-request introspection hop (local path — the
# monorepo's 0.2 PASETO verifier). The `fetch` feature adds the boot-time
# HTTP key-set fetch (`Verifier::from_paseto_keys_url`) used when
# `COURSE_PASETO_KEYS_URL` is set.
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", features = ["fetch"] }

# Durable event bus Phase 3 (BUS-3; agents/share/event-bus.md §5/§8):
# the relay's real broker sink. Optional and behind the `fluvio` feature
# below so the default dependency tree (and every existing deployment's
# build) is unchanged — the relay's `LoggingSink` covers dev/CI with no
# broker at all.
fluvio = { version = "0.50", optional = true }

[features]
# Off by default. The relay's `EventSink` seam (src/relay.rs) needs no
# feature to build or test; only `FluvioSink` — the real-broker producer
# — lives behind this.
fluvio = ["dep:fluvio"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.27"
criterion = { version = "0.5", features = ["html_reports"] }

# An in-process OTLP/gRPC collector for `tests/otlp_export.rs` /
# `tests/otlp_middleware.rs` (PRO-H12, ported from person-service): the
# generated `TraceServiceServer` / `MetricsServiceServer` plus tonic's
# server transport, so the export pipeline is proved against a real gRPC
# listener in a normal `cargo test` run — no external collector, nothing
# `#[ignore]`d.
opentelemetry-proto = { version = "0.32", default-features = false, features = [
  "gen-tonic",
  "trace",
  "metrics",
] }
# Plain `tonic`, not a renamed `package = "tonic"` dev-dependency like
# person/worker/event needed: this crate carries no gRPC stub of its own
# (`agents/share/overview.md`'s capability matrix — course is `–` on
# gRPC), so there is no `E0464` extern-prelude collision to dodge.
tonic = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
# The mounted-middleware test (`tests/otlp_middleware.rs`) makes a real
# HTTP request against a served router; this crate has no other direct
# `reqwest` dependency.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the bearer-verification path is exercised without the auth service or
# any network dependency.
ed25519-dalek = { version = "2.2" }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
base64 = { version = "0.22" }
# The activation proof (tests/enforcement.rs) sets process-wide env vars
# before booting the router, so it must not run beside another test in
# the same process.
serial_test = "3.5"

[[bench]]
name = "matching_bench"
harness = false

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "validation_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
