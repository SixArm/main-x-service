name: Test

on:
  push:
    branches:
      - main
  pull_request:

env:
  RUST_TOOLCHAIN: stable

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_DB: course_service_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        # Set health checks to wait until postgres has started
        options: --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
      # `--include-ignored` runs BOTH the default (DB-free) tests and the
      # `#[ignore]`d DB-backed suites against the Postgres service, so the
      # request tests actually execute in CI rather than being skipped (H-4).
      - name: Run cargo test (incl. DB-gated)
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all-features --all -- --include-ignored
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/course_service_test
