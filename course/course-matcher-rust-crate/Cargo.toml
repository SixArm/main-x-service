[package]
name = "course-matcher"
version = "0.6.1"
edition = "2024"
rust-version = "1.95"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Course matcher — pairwise course-record matching with weighted fuzzy + deterministic strategies, modelled on schema.org/Course"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/sixarm/main-x-service/course-matcher-rust-crate"
keywords = ["course", "matching", "schema-org", "identity"]
categories = ["algorithms", "text-processing"]

[lib]
name = "course_matcher"
path = "src/lib.rs"

[[bin]]
name = "course-matcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
unicode-normalization = "0.1"
thiserror = "2.0"
mimalloc = "0.1.52"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bench]]
name = "match_pair"
harness = false
