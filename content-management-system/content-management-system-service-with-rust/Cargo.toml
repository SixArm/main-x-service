[workspace]

[package]
name = "content-management-system-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = true
default-run = "content-management-system-service"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Content management system service — headless content modelling, authoring, assets, editorial workflow, localization, delivery"
readme = "README.md"
repository = "https://github.com/sixarm/main-x-service/content-management-system-service-with-rust"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["cms", "content", "headless", "publishing", "editorial"]
categories = ["development-tools", "rust-patterns"]
include = ["src/**/*", "README.md"]

[workspace.dependencies]
# `auth` is deliberately absent from this feature list. It is loco's JWT
# support (`dep:jsonwebtoken`, and therefore `rsa` / RUSTSEC-2023-0071),
# and this family issues PASETO v4.public rather than JWT — see
# agents/share/jwt.md. Dropping it removes the vulnerable crate from the
# dependency graph rather than suppressing the advisory.
loco-rs = { version = "1.0.1", default-features = false, features = ["cli", "with-db", "cache_inmem", "worker"] }

[dependencies]
loco-rs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.53", default-features = false, features = [
  "rt-multi-thread",
  # `sync::OnceCell` holds the artifact store: building it is async (an
  # object-store client), so `std::sync::OnceLock` cannot initialise it.
  "sync",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8", features = ["multipart"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
uuid = { version = "1.24", features = ["v4", "serde"] }
mimalloc = { version = "0.1.52" }
prometheus = { version = "0.13" }
# Upstream display-name lookups (`http` client mode only; stub is the
# default). Same minimal reqwest configuration as the verifier's fetch.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

# Content addressing: an asset's storage key is the SHA-256 of its
# bytes, so identical uploads deduplicate and an uploader can never
# choose a key (CMS-R6).
sha2 = { version = "0.10" }

# Webhook body signing (HMAC-SHA256), the RustCrypto pairing for the
# sha2 above. Not the family `integrity-mac` crate: that one protects
# *stored rows* with a key the service alone holds and never shares,
# whereas a webhook secret must be handed to a third party so they can
# verify — a different problem with a different key lifecycle. Not
# hand-rolled either: HMAC is short enough to look easy and exactly the
# kind of code that fails silently.
hmac = { version = "0.12" }

# HTML sanitization for the one place markup may enter (an `embed`
# block, and later bulk import). A real HTML5 tokenizer, because
# pattern-matching sanitizers are how stored XSS ships — see
# `src/rules/sanitize.rs` for the full reasoning.
ammonia = { version = "4" }

# Cross-service entity references (EntityRef URN + entity-type registry):
# authors/editors and publishing bodies are referenced, never duplicated,
# and content *about* a registered entity carries its URN as a pointer.
entity-ref = { path = "../../link/entity-ref-rust-crate" }

# Offline PASETO v4.public verification + the shared ABAC engine.
authentication-verifier = { path = "../../authentication/authentication-verifier-rust-crate", features = ["fetch"] }

# S3-compatible object storage for asset bytes, behind the optional
# `s3` feature so a deployment using local storage pays nothing for it
# (the care-pathway `ArtifactStore` posture, reused verbatim).
aws-config = { version = "1", optional = true, default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
] }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
] }
aws-credential-types = { version = "1", optional = true }

[features]
default = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:aws-credential-types"]

[[bin]]
name = "content-management-system-service"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
# Name the `TestServer` type in shared request-test helpers (same
# version loco's testing feature uses internally).
axum-test = { version = "17.3.0" }
tokio = { version = "1.53", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "net",
] }
serial_test = { version = "3.5.0" }
# The artifact-store tests write to a scratch directory and prove the
# path-confinement rule against a file outside the base.
tempfile = { version = "3" }
# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the auth path is verified without the auth service or a network.
ed25519-dalek = { version = "2.2" }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
sha2 = { version = "0.10" }
base64 = { version = "0.22" }
