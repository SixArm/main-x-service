# Loco configuration file — content-management-system-service (production).
#
# This file previously held only a `server:` block (added for the
# SEC-M1 body-limit fix) plus `cache:` — no `logger:` or `database:`
# at all. loco's top-level `Config` struct declares `logger`, `server`,
# and `database` as required fields with no defaults, so this file
# still could not have deserialized in production. Filled out to
# mirror this crate's own development.yaml / test.yaml (same env-var
# names), plus the family's production middleware shape (person-service
# is the reference).

logger:
  enable: true
  pretty_backtrace: false
  level: info
  format: json

server:
  port: {{ get_env(name="PORT", default="5150") }}
  binding: 0.0.0.0
  host: {{ get_env(name="HOST", default="http://localhost") }}
  middlewares:
    # `src/controllers/assets.rs::DEFAULT_MAX_UPLOAD_BYTES` (25mb,
    # raisable via `CMS_MAX_UPLOAD_BYTES`) is the application's own cap
    # on an asset upload; this framework-level cap must sit above it,
    # with headroom for an operator raising `CMS_MAX_UPLOAD_BYTES`, or
    # loco's own (much smaller) default silently 413s an upload the app
    # would otherwise accept — see SEC-M1. Raise this too if
    # `CMS_MAX_UPLOAD_BYTES` is ever raised past 30mb.
    limit_payload:
      enable: true
      body_limit: 30mb

workers:
  mode: BackgroundQueue

queue:
  kind: Postgres
  uri: {{ get_env(name="DATABASE_URL") }}
  dangerously_flush: false

mailer:
  smtp:
    enable: true
    host: {{ get_env(name="SMTP_HOST", default="localhost") }}
    port: {{ get_env(name="SMTP_PORT", default="587") }}
    secure: true
    auth:
      user: {{ get_env(name="SMTP_USER", default="") }}
      password: {{ get_env(name="SMTP_PASSWORD", default="") }}

database:
  uri: {{ get_env(name="DATABASE_URL") }}
  enable_logging: false
  connect_timeout: {{ get_env(name="DB_CONNECT_TIMEOUT", default="500") }}
  idle_timeout: {{ get_env(name="DB_IDLE_TIMEOUT", default="500") }}
  min_connections: {{ get_env(name="DB_MIN_CONNECTIONS", default="2") }}
  max_connections: {{ get_env(name="DB_MAX_CONNECTIONS", default="20") }}
  auto_migrate: false
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: {{ get_env(name="JWT_SECRET") }}
    expiration: 604800

# Cache provider: in-memory (loco `cache_inmem`, enabled by default).
cache:
  kind: InMem
  max_capacity: 33554432 # 32MiB (default if not specified)
